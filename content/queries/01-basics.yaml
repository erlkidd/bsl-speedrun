topic: Основы выборки
kb: queries/zapros-osnovy
tasks:
  - id: q-basic-sklady
    title: Все склады
    difficulty: 1
    text: Выбери **Код** и **Наименование** всех складов.
    starter: "ВЫБРАТЬ\n    \nИЗ Справочник.Склады"
    solution: ВЫБРАТЬ Код, Наименование ИЗ Справочник.Склады
    hints: ["Поля перечисляются через запятую сразу после ВЫБРАТЬ."]
  - id: q-basic-almaty
    title: Покупатели из Алматы
    difficulty: 1
    text: "**Наименование** и **ИНН** контрагентов из города Алматы, которые не являются поставщиками."
    starter: "ВЫБРАТЬ\n    Наименование, ИНН\nИЗ Справочник.Контрагенты\nГДЕ "
    solution: ВЫБРАТЬ Наименование, ИНН ИЗ Справочник.Контрагенты ГДЕ Город = "Алматы" И НЕ ЭтоПоставщик
    hints: ["Строки в запросе — в двойных кавычках.", "Булево поле проверяют без «= ЛОЖЬ»: `НЕ ЭтоПоставщик`."]
  - id: q-basic-between
    title: Оклады в диапазоне
    difficulty: 1
    ordered: true
    text: Сотрудники с окладом от 400 000 до 700 000 включительно — **Наименование**, **Оклад**, от большего оклада к меньшему.
    starter: "ВЫБРАТЬ\n    Наименование, Оклад\nИЗ Справочник.Сотрудники\n"
    solution: ВЫБРАТЬ Наименование, Оклад ИЗ Справочник.Сотрудники ГДЕ Оклад МЕЖДУ 400000 И 700000 УПОРЯДОЧИТЬ ПО Оклад УБЫВ
    hints: ["`МЕЖДУ 400000 И 700000` включает обе границы.", "Сортировка по убыванию: `УПОРЯДОЧИТЬ ПО Оклад УБЫВ`."]
  - id: q-basic-like
    title: Только ТОО
    difficulty: 1
    text: "**Наименование** контрагентов, у которых оно начинается с «ТОО»."
    starter: "ВЫБРАТЬ\n    Наименование\nИЗ Справочник.Контрагенты\nГДЕ "
    solution: ВЫБРАТЬ Наименование ИЗ Справочник.Контрагенты ГДЕ Наименование ПОДОБНО "ТОО%"
    hints: ["В шаблоне ПОДОБНО знак `%` — любая последовательность символов, `_` — один символ."]
  - id: q-basic-hierarchy
    title: Вся электроника
    difficulty: 2
    text: "**Наименование** всех элементов (не групп) справочника Номенклатура, которые лежат в группе `&Группа` на любом уровне вложенности."
    params: { Группа: Справочник.Номенклатура.Электроника }
    starter: "ВЫБРАТЬ\n    Наименование\nИЗ Справочник.Номенклатура\nГДЕ "
    solution: ВЫБРАТЬ Наименование ИЗ Справочник.Номенклатура ГДЕ Ссылка В ИЕРАРХИИ (&Группа) И НЕ ЭтоГруппа
    hints: ["`Родитель = &Группа` даёт только один уровень. Все уровни: `Ссылка В ИЕРАРХИИ (&Группа)`.", "Сама группа тоже входит в свою иерархию — отсеки её через `НЕ ЭтоГруппа`."]
  - id: q-basic-case
    title: Категория оклада
    difficulty: 2
    text: "Для каждого сотрудника: **Наименование** и **Категория** — строка «Высокий», если оклад от 600 000, иначе «Обычный»."
    starter: "ВЫБРАТЬ\n    Наименование,\n    ВЫБОР\n        \n    КОНЕЦ КАК Категория\nИЗ Справочник.Сотрудники"
    solution: ВЫБРАТЬ Наименование, ВЫБОР КОГДА Оклад >= 600000 ТОГДА "Высокий" ИНАЧЕ "Обычный" КОНЕЦ КАК Категория ИЗ Справочник.Сотрудники
    hints: ["`ВЫБОР КОГДА <условие> ТОГДА <значение> ИНАЧЕ <значение> КОНЕЦ`."]
  - id: q-basic-dot
    title: Через точку
    difficulty: 2
    ordered: true
    text: "Проведённые реализации: **Номер**, **Покупатель** (наименование контрагента), **Город** контрагента. Отсортируй по номеру. Соединения не нужны — обратись к полям контрагента через точку."
    starter: "ВЫБРАТЬ\n    Номер,\n    \nИЗ Документ.РеализацияТоваров\nГДЕ Проведен"
    solution: ВЫБРАТЬ Номер, Контрагент.Наименование КАК Покупатель, Контрагент.Город КАК Город ИЗ Документ.РеализацияТоваров ГДЕ Проведен УПОРЯДОЧИТЬ ПО Номер
    hints: ["Поле-ссылку можно «разыменовать»: `Контрагент.Город`. Платформа сама сделает соединение."]
