topic: Регистры накопления
kb: queries/registry-nakopleniya
tasks:
  - id: q-accum-balance
    title: Остатки на дату
    difficulty: 1
    text: "Остатки товаров на `&Дата` в разрезе складов: **Склад**, **Номенклатура**, **КоличествоОстаток**."
    params: { Дата: "01.03.2026" }
    starter: "ВЫБРАТЬ\n    Склад, Номенклатура, КоличествоОстаток\nИЗ РегистрНакопления.ТоварыНаСкладах."
    solution: ВЫБРАТЬ Склад, Номенклатура, КоличествоОстаток ИЗ РегистрНакопления.ТоварыНаСкладах.Остатки(&Дата)
    hints: ["`Остатки(&Дата)` — остаток на начало указанного момента (движения самой этой секунды не входят)."]
  - id: q-accum-value
    title: Стоимость склада
    difficulty: 3
    text: "Текущие остатки, оценённые по закупочным ценам: **Номенклатура**, **Количество** (остаток), **Стоимость** = остаток × закупочная цена."
    starter: "ВЫБРАТЬ\n    Ост.Номенклатура,\n    Ост.КоличествоОстаток КАК Количество,\n    \nИЗ РегистрНакопления.ТоварыНаСкладах.Остатки() КАК Ост\n    "
    solution: ВЫБРАТЬ Ост.Номенклатура, Ост.КоличествоОстаток КАК Количество, Ост.КоличествоОстаток * Цены.Цена КАК Стоимость ИЗ РегистрНакопления.ТоварыНаСкладах.Остатки() КАК Ост ЛЕВОЕ СОЕДИНЕНИЕ РегистрСведений.ЦеныНоменклатуры.СрезПоследних(, ВидЦены = ЗНАЧЕНИЕ(Справочник.ВидыЦен.Закупочная)) КАК Цены ПО Ост.Номенклатура = Цены.Номенклатура
    hints: ["Склад в запросе не выбран — остаток свернётся по всем складам.", "Цены — из среза последних закупочных цен, соединение по номенклатуре."]
  - id: q-accum-months
    title: Выручка по месяцам
    difficulty: 2
    ordered: true
    text: "Обороты регистра **Продажи** с периодичностью «Месяц»: **Период**, **СуммаОборот**, по возрастанию периода."
    require: [{ pattern: "\\.Обороты\\s*\\(", message: "Используй виртуальную таблицу Обороты с периодичностью Месяц" }]
    starter: "ВЫБРАТЬ\n    Период, СуммаОборот\nИЗ РегистрНакопления.Продажи.Обороты( , , )\n"
    solution: ВЫБРАТЬ Период, СуммаОборот ИЗ РегистрНакопления.Продажи.Обороты(, , Месяц) УПОРЯДОЧИТЬ ПО Период
    hints: ["Третий параметр Оборотов — периодичность: `Обороты(, , Месяц)`. Появляется поле Период — начало месяца."]
  - id: q-accum-debts
    title: Кто должен
    difficulty: 1
    ordered: true
    text: "Текущие долги покупателей по регистру **Взаиморасчеты**: **Контрагент**, **СуммаОстаток**, от большего долга к меньшему."
    starter: "ВЫБРАТЬ\n    Контрагент, СуммаОстаток\nИЗ РегистрНакопления.Взаиморасчеты."
    solution: ВЫБРАТЬ Контрагент, СуммаОстаток ИЗ РегистрНакопления.Взаиморасчеты.Остатки() УПОРЯДОЧИТЬ ПО СуммаОстаток УБЫВ
    hints: ["Приход — отгрузка покупателю, расход — его оплата. Остаток = долг."]
  - id: q-accum-nosales
    title: Залежавшийся товар
    difficulty: 3
    text: "Товары (вид Товар, не группы, не помеченные на удаление), по которым не было продаж за `&Начало`…`&Конец`. Одна колонка: **Наименование**."
    params: { Начало: "01.04.2026", Конец: "30.06.2026 23:59:59" }
    starter: "ВЫБРАТЬ\n    Ном.Наименование\nИЗ Справочник.Номенклатура КАК Ном\n    ЛЕВОЕ СОЕДИНЕНИЕ РегистрНакопления.Продажи.Обороты(&Начало, &Конец) КАК Продажи\n    ПО Продажи.Номенклатура = Ном.Ссылка\nГДЕ "
    solution: ВЫБРАТЬ Ном.Наименование ИЗ Справочник.Номенклатура КАК Ном ЛЕВОЕ СОЕДИНЕНИЕ РегистрНакопления.Продажи.Обороты(&Начало, &Конец) КАК Продажи ПО Продажи.Номенклатура = Ном.Ссылка ГДЕ Продажи.Номенклатура ЕСТЬ NULL И НЕ Ном.ЭтоГруппа И НЕ Ном.ПометкаУдаления И Ном.ВидНоменклатуры = ЗНАЧЕНИЕ(Перечисление.ВидыНоменклатуры.Товар)
    hints: ["Строки без оборотов после левого соединения — те, где поля правой таблицы ЕСТЬ NULL."]
  - id: q-accum-move
    title: Движение по ноутбукам
    difficulty: 2
    text: "По товару `&Товар` за `&Начало`…`&Конец`: **КоличествоНачальныйОстаток**, **КоличествоПриход**, **КоличествоРасход**, **КоличествоКонечныйОстаток** — одной строкой. Отбор по товару — в параметрах виртуальной таблицы."
    params: { Товар: Справочник.Номенклатура.Ноутбук, Начало: "01.02.2026", Конец: "30.04.2026 23:59:59" }
    forbid: [{ pattern: "\\bГДЕ\\b", message: "Отбор по товару передай в параметры виртуальной таблицы, а не в ГДЕ" }]
    starter: "ВЫБРАТЬ\n    КоличествоНачальныйОстаток, КоличествоПриход, КоличествоРасход, КоличествоКонечныйОстаток\nИЗ РегистрНакопления.ТоварыНаСкладах.ОстаткиИОбороты(&Начало, &Конец, , , )"
    solution: ВЫБРАТЬ КоличествоНачальныйОстаток, КоличествоПриход, КоличествоРасход, КоличествоКонечныйОстаток ИЗ РегистрНакопления.ТоварыНаСкладах.ОстаткиИОбороты(&Начало, &Конец, , , Номенклатура = &Товар)
    hints: ["У ОстаткиИОбороты условие — пятый параметр: (Начало, Конец, Периодичность, МетодДополнения, Условие)."]
