topic: Регистры сведений
kb: queries/registry-svedeniy
tasks:
  - id: q-info-rates
    title: Курсы на дату
    difficulty: 1
    text: "Курсы всех валют, действующие на `&Дата`: **Валюта**, **Курс**."
    params: { Дата: "10.04.2026" }
    starter: "ВЫБРАТЬ\n    Валюта, Курс\nИЗ РегистрСведений.КурсыВалют."
    solution: ВЫБРАТЬ Валюта, Курс ИЗ РегистрСведений.КурсыВалют.СрезПоследних(&Дата)
    hints: ["`СрезПоследних(&Дата)` — самая поздняя запись по каждой валюте не позже даты."]
  - id: q-info-first
    title: Первая цена
    difficulty: 2
    text: "Самая первая установленная розничная цена каждого товара: **Номенклатура**, **Период**, **Цена**."
    starter: "ВЫБРАТЬ\n    Номенклатура, Период, Цена\nИЗ РегистрСведений.ЦеныНоменклатуры."
    solution: ВЫБРАТЬ Номенклатура, Период, Цена ИЗ РегистрСведений.ЦеныНоменклатуры.СрезПервых(, ВидЦены = ЗНАЧЕНИЕ(Справочник.ВидыЦен.Розничная))
    hints: ["Зеркало СрезаПоследних — `СрезПервых`: самая ранняя запись.", "Вид цены — в параметрах: `ВидЦены = ЗНАЧЕНИЕ(Справочник.ВидыЦен.Розничная)`."]
  - id: q-info-barcode
    title: Товар по штрихкоду
    difficulty: 1
    text: "Найди **Номенклатура** по штрихкоду `&Штрихкод`. Регистр ШтрихкодыНоменклатуры непериодический — срезов у него нет."
    params: { Штрихкод: '"4870001000028"' }
    starter: "ВЫБРАТЬ\n    Номенклатура\nИЗ РегистрСведений.ШтрихкодыНоменклатуры\nГДЕ "
    solution: ВЫБРАТЬ Номенклатура ИЗ РегистрСведений.ШтрихкодыНоменклатуры ГДЕ Штрихкод = &Штрихкод
    hints: ["У непериодического регистра нет поля Период и виртуальных таблиц — только сама таблица записей."]
  - id: q-info-usd
    title: Реализации в долларах
    difficulty: 3
    text: "Проведённые реализации, пересчитанные в USD по курсу на `&Дата`: **Номер**, **СуммаВал** — сумма документа, делённая на курс и приведённая к `Число(15, 2)`."
    params: { Дата: "30.06.2026" }
    starter: "ВЫБРАТЬ\n    Док.Номер,\n    \nИЗ Документ.РеализацияТоваров КАК Док\n    ВНУТРЕННЕЕ СОЕДИНЕНИЕ РегистрСведений.КурсыВалют.СрезПоследних(&Дата, Валюта = ЗНАЧЕНИЕ(Справочник.Валюты.USD)) КАК Курсы\n    ПО ИСТИНА\nГДЕ Док.Проведен"
    solution: ВЫБРАТЬ Док.Номер, ВЫРАЗИТЬ(Док.СуммаДокумента / Курсы.Курс КАК Число(15, 2)) КАК СуммаВал ИЗ Документ.РеализацияТоваров КАК Док ВНУТРЕННЕЕ СОЕДИНЕНИЕ РегистрСведений.КурсыВалют.СрезПоследних(&Дата, Валюта = ЗНАЧЕНИЕ(Справочник.Валюты.USD)) КАК Курсы ПО ИСТИНА ГДЕ Док.Проведен
    hints: ["Срез по одной валюте — одна строка, её присоединяют `ПО ИСТИНА`.", "Округление: `ВЫРАЗИТЬ(<выражение> КАК Число(15, 2))`."]
  - id: q-info-margin
    title: Наценка
    difficulty: 3
    text: "Для товаров, у которых есть и закупочная, и розничная цена на `&Дата`: **Номенклатура**, **Наценка** = розничная − закупочная. Срез берётся дважды под разными псевдонимами."
    params: { Дата: "01.06.2026" }
    starter: "ВЫБРАТЬ\n    Закуп.Номенклатура,\n    \nИЗ РегистрСведений.ЦеныНоменклатуры.СрезПоследних(&Дата, ВидЦены = ЗНАЧЕНИЕ(Справочник.ВидыЦен.Закупочная)) КАК Закуп\n    "
    solution: ВЫБРАТЬ Закуп.Номенклатура, Розн.Цена - Закуп.Цена КАК Наценка ИЗ РегистрСведений.ЦеныНоменклатуры.СрезПоследних(&Дата, ВидЦены = ЗНАЧЕНИЕ(Справочник.ВидыЦен.Закупочная)) КАК Закуп ВНУТРЕННЕЕ СОЕДИНЕНИЕ РегистрСведений.ЦеныНоменклатуры.СрезПоследних(&Дата, ВидЦены = ЗНАЧЕНИЕ(Справочник.ВидыЦен.Розничная)) КАК Розн ПО Закуп.Номенклатура = Розн.Номенклатура
    hints: ["Вторую виртуальную таблицу присоединяют так же, как обычную: `ВНУТРЕННЕЕ СОЕДИНЕНИЕ …СрезПоследних(…) КАК Розн ПО …`."]
