topic: Группировки и итоги
kb: queries/zapros-gruppirovki
tasks:
  - id: q-group-depts
    title: Фонд окладов по отделам
    difficulty: 1
    text: "По справочнику Сотрудники: **Подразделение**, **Сотрудников** (количество), **Фонд** (сумма окладов)."
    starter: "ВЫБРАТЬ\n    Подразделение,\n    \nИЗ Справочник.Сотрудники\n"
    solution: ВЫБРАТЬ Подразделение, КОЛИЧЕСТВО(*) КАК Сотрудников, СУММА(Оклад) КАК Фонд ИЗ Справочник.Сотрудники СГРУППИРОВАТЬ ПО Подразделение
    hints: ["Всё, что не под агрегатной функцией, должно стоять в `СГРУППИРОВАТЬ ПО`."]
  - id: q-group-avg
    title: Средний чек менеджера
    difficulty: 2
    text: "По проведённым реализациям: **Ответственный** и **СреднийЧек** (средняя сумма документа)."
    starter: "ВЫБРАТЬ\n    Ответственный,\n    \nИЗ Документ.РеализацияТоваров\n"
    solution: ВЫБРАТЬ Ответственный, СРЕДНЕЕ(СуммаДокумента) КАК СреднийЧек ИЗ Документ.РеализацияТоваров ГДЕ Проведен СГРУППИРОВАТЬ ПО Ответственный
    hints: ["Отбор исходных строк (`ГДЕ Проведен`) идёт до группировки."]
  - id: q-group-having
    title: Популярные товары
    difficulty: 2
    text: "По регистру **Продажи**: товары, которые покупали минимум 3 разных контрагента. Колонки: **Номенклатура**, **Покупателей**."
    require: [{ pattern: "ИМЕЮЩИЕ", message: "Условие на результат агрегата пишут в ИМЕЮЩИЕ" }]
    starter: "ВЫБРАТЬ\n    Номенклатура,\n    КОЛИЧЕСТВО(РАЗЛИЧНЫЕ Контрагент) КАК Покупателей\nИЗ РегистрНакопления.Продажи\n"
    solution: ВЫБРАТЬ Номенклатура, КОЛИЧЕСТВО(РАЗЛИЧНЫЕ Контрагент) КАК Покупателей ИЗ РегистрНакопления.Продажи СГРУППИРОВАТЬ ПО Номенклатура ИМЕЮЩИЕ КОЛИЧЕСТВО(РАЗЛИЧНЫЕ Контрагент) >= 3
    hints: ["В ИМЕЮЩИЕ агрегат пишется целиком, псевдоним колонки там не работает."]
  - id: q-group-quarter
    title: Продажи по кварталам
    difficulty: 2
    ordered: true
    text: "По регистру **Продажи**: **Квартал** (номер квартала периода) и **Сумма**. Упорядочь по кварталу."
    starter: "ВЫБРАТЬ\n    КВАРТАЛ(Период) КАК Квартал,\n    \nИЗ РегистрНакопления.Продажи\n"
    solution: ВЫБРАТЬ КВАРТАЛ(Период) КАК Квартал, СУММА(Сумма) КАК Сумма ИЗ РегистрНакопления.Продажи СГРУППИРОВАТЬ ПО КВАРТАЛ(Период) УПОРЯДОЧИТЬ ПО Квартал
    hints: ["Группировать можно по выражению — оно должно совпадать с выражением в списке полей."]
  - id: q-group-totals
    title: Итоги по контрагентам
    difficulty: 3
    text: "По регистру **Продажи** выбери **Контрагент**, **Номенклатура**, **Сумма** (сумма по паре) и добавь итоговые строки по каждому контрагенту: `ИТОГИ СУММА(Сумма) ПО Контрагент`."
    starter: "ВЫБРАТЬ\n    Контрагент,\n    Номенклатура,\n    СУММА(Сумма) КАК Сумма\nИЗ РегистрНакопления.Продажи\nСГРУППИРОВАТЬ ПО Контрагент, Номенклатура\n"
    solution: ВЫБРАТЬ Контрагент, Номенклатура, СУММА(Сумма) КАК Сумма ИЗ РегистрНакопления.Продажи СГРУППИРОВАТЬ ПО Контрагент, Номенклатура ИТОГИ СУММА(Сумма) ПО Контрагент
    hints: ["ИТОГИ пишут в самом конце запроса. В результат добавляются строки-итоги (в таблице они помечены Σ)."]
