topic: Регистры бухгалтерии и расчёта
kb: queries/registry-buhgalterii
tasks:
  - id: q-acc-41
    title: Товары на счёте 41.01
    difficulty: 2
    text: "Остатки счёта `&Счет` (41.01) в разрезе первого субконто: **Номенклатура** (это Субконто1), **КоличествоОстаток**, **СуммаОстаток**."
    params: { Счет: ПланСчетов.Хозрасчетный.ТоварыНаСкладах }
    starter: "ВЫБРАТЬ\n    Субконто1 КАК Номенклатура,\n    КоличествоОстаток,\n    СуммаОстаток\nИЗ РегистрБухгалтерии.Хозрасчетный.Остатки( , )"
    solution: ВЫБРАТЬ Субконто1 КАК Номенклатура, КоличествоОстаток, СуммаОстаток ИЗ РегистрБухгалтерии.Хозрасчетный.Остатки(, Счет = &Счет)
    hints: ["Остатки(Период, УсловиеСчета, Субконто, Условие): условие счёта — второй параметр, `Счет = &Счет`."]
  - id: q-acc-62
    title: Обороты с покупателями
    difficulty: 2
    text: "Обороты счёта `&Счет` (62.01) по контрагентам за `&Начало`…`&Конец`: **Субконто1**, **СуммаОборотДт**, **СуммаОборотКт**."
    params: { Счет: ПланСчетов.Хозрасчетный.РасчетыСПокупателями, Начало: "01.01.2026", Конец: "31.03.2026 23:59:59" }
    starter: "ВЫБРАТЬ\n    Субконто1, СуммаОборотДт, СуммаОборотКт\nИЗ РегистрБухгалтерии.Хозрасчетный.Обороты(&Начало, &Конец, , )"
    solution: ВЫБРАТЬ Субконто1, СуммаОборотДт, СуммаОборотКт ИЗ РегистрБухгалтерии.Хозрасчетный.Обороты(&Начало, &Конец, , Счет = &Счет)
    hints: ["У Оборотов условие счёта — четвёртый параметр: (Начало, Конец, Периодичность, УсловиеСчета, …)."]
  - id: q-acc-revenue
    title: Выручка по товарам из проводок
    difficulty: 3
    text: "По таблице **ОборотыДтКт** — обороты в кредит счёта `&Счет` (90.01): **Номенклатура** (СубконтоКт1) и **СуммаОборот**."
    params: { Счет: ПланСчетов.Хозрасчетный.Выручка }
    starter: "ВЫБРАТЬ\n    СубконтоКт1 КАК Номенклатура,\n    СуммаОборот\nИЗ РегистрБухгалтерии.Хозрасчетный.ОборотыДтКт( , , , , , )"
    solution: ВЫБРАТЬ СубконтоКт1 КАК Номенклатура, СуммаОборот ИЗ РегистрБухгалтерии.Хозрасчетный.ОборотыДтКт(, , , , , СчетКт = &Счет)
    hints: ["ОборотыДтКт(Начало, Конец, Периодичность, УсловиеСчетаДт, СубконтоДт, УсловиеСчетаКт, …) — условие кредитового счёта шестое."]
  - id: q-acc-hierarchy
    title: Все субсчета 90
    difficulty: 3
    text: "Обороты по счёту `&Счет` (90) и всем его субсчетам: **Счет**, **СуммаОборотДт**, **СуммаОборотКт**."
    params: { Счет: ПланСчетов.Хозрасчетный.Продажи }
    starter: "ВЫБРАТЬ\n    Счет, СуммаОборотДт, СуммаОборотКт\nИЗ РегистрБухгалтерии.Хозрасчетный.Обороты(, , , )"
    solution: ВЫБРАТЬ Счет, СуммаОборотДт, СуммаОборотКт ИЗ РегистрБухгалтерии.Хозрасчетный.Обороты(, , , Счет В ИЕРАРХИИ (&Счет))
    hints: ["Проводки идут по субсчетам 90.01 и 90.02. Чтобы захватить их по счёту-группе: `Счет В ИЕРАРХИИ (&Счет)`."]
  - id: q-calc-salary
    title: Оклады за месяц
    difficulty: 1
    text: "Записи регистра расчёта **Начисления** за период регистрации `&Месяц` с видом расчёта «Оклад»: **Сотрудник**, **Результат**, **ОтработаноДней**."
    params: { Месяц: "01.02.2026" }
    starter: "ВЫБРАТЬ\n    Сотрудник, Результат, ОтработаноДней\nИЗ РегистрРасчета.Начисления\nГДЕ "
    solution: ВЫБРАТЬ Сотрудник, Результат, ОтработаноДней ИЗ РегистрРасчета.Начисления ГДЕ ПериодРегистрации = &Месяц И ВидРасчета = ЗНАЧЕНИЕ(ПланВидовРасчета.Начисления.Оклад)
    hints: ["Вид расчёта — предопределённый элемент плана видов расчёта: `ЗНАЧЕНИЕ(ПланВидовРасчета.Начисления.Оклад)`."]
  - id: q-calc-extra
    title: Кто получил не только оклад
    difficulty: 2
    text: "Сотрудники, у которых за период регистрации `&Месяц` есть несторнирующие начисления помимо оклада. Одна колонка **Сотрудник**, без повторов."
    params: { Месяц: "01.03.2026" }
    starter: "ВЫБРАТЬ РАЗЛИЧНЫЕ\n    Сотрудник\nИЗ РегистрРасчета.Начисления\nГДЕ "
    solution: ВЫБРАТЬ РАЗЛИЧНЫЕ Сотрудник ИЗ РегистрРасчета.Начисления ГДЕ ПериодРегистрации = &Месяц И ВидРасчета <> ЗНАЧЕНИЕ(ПланВидовРасчета.Начисления.Оклад) И НЕ Сторно
    hints: ["`<>` — «не равно». Сторно-записи отсекаются булевым полем: `НЕ Сторно`."]
  - id: q-calc-period
    title: Отсутствия по периоду действия
    difficulty: 3
    ordered: true
    text: "Отпуска и больничные: **Сотрудник**, **ВидРасчета**, **Дней** — число календарных дней между началом и концом периода действия плюс один (`РАЗНОСТЬДАТ(…, …, ДЕНЬ) + 1`). Упорядочь по сотруднику."
    starter: "ВЫБРАТЬ\n    Сотрудник,\n    ВидРасчета,\n    \nИЗ РегистрРасчета.Начисления\nГДЕ ВидРасчета В (ЗНАЧЕНИЕ(ПланВидовРасчета.Начисления.Отпуск), ЗНАЧЕНИЕ(ПланВидовРасчета.Начисления.Больничный))\n"
    solution: ВЫБРАТЬ Сотрудник, ВидРасчета, РАЗНОСТЬДАТ(ПериодДействияНачало, ПериодДействияКонец, ДЕНЬ) + 1 КАК Дней ИЗ РегистрРасчета.Начисления ГДЕ ВидРасчета В (ЗНАЧЕНИЕ(ПланВидовРасчета.Начисления.Отпуск), ЗНАЧЕНИЕ(ПланВидовРасчета.Начисления.Больничный)) УПОРЯДОЧИТЬ ПО Сотрудник
    hints: ["Период регистрации — месяц, в котором запись сделана. Период действия — даты, за которые начислено."]
