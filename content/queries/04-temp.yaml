topic: Временные таблицы и пакеты
kb: queries/zapros-vremennye-tablicy
tasks:
  - id: q-temp-top
    title: Остатки топовых товаров
    difficulty: 2
    text: "Шаг 1: во временную таблицу **втТоп** — три товара с наибольшей суммой продаж (регистр Продажи). Шаг 2: текущие остатки только по этим товарам — **Номенклатура**, **КоличествоОстаток**."
    require: [{ pattern: "ПОМЕСТИТЬ", message: "Нужна временная таблица (ПОМЕСТИТЬ)" }]
    starter: "ВЫБРАТЬ ПЕРВЫЕ 3\n    Номенклатура,\n    СУММА(Сумма) КАК Сумма\nПОМЕСТИТЬ втТоп\nИЗ РегистрНакопления.Продажи\nСГРУППИРОВАТЬ ПО Номенклатура\nУПОРЯДОЧИТЬ ПО Сумма УБЫВ\n;\n"
    solution: ВЫБРАТЬ ПЕРВЫЕ 3 Номенклатура, СУММА(Сумма) КАК Сумма ПОМЕСТИТЬ втТоп ИЗ РегистрНакопления.Продажи СГРУППИРОВАТЬ ПО Номенклатура УПОРЯДОЧИТЬ ПО Сумма УБЫВ; ВЫБРАТЬ Номенклатура, КоличествоОстаток ИЗ РегистрНакопления.ТоварыНаСкладах.Остатки(, Номенклатура В (ВЫБРАТЬ Номенклатура ИЗ втТоп))
    hints: ["Отбор по временной таблице передают в параметры виртуальной: `Номенклатура В (ВЫБРАТЬ Номенклатура ИЗ втТоп)`."]
  - id: q-temp-share
    title: Доля покупателя в выручке
    difficulty: 3
    text: "Шаг 1: **втВсего** — одна строка с общей суммой продаж (колонка Итого). Шаг 2: по каждому контрагенту **Контрагент** и **Доля** — процент его продаж от общей суммы (`Сумма * 100 / Итого`)."
    require: [{ pattern: "ПОМЕСТИТЬ", message: "Нужна временная таблица (ПОМЕСТИТЬ)" }]
    starter: "ВЫБРАТЬ СУММА(Сумма) КАК Итого\nПОМЕСТИТЬ втВсего\nИЗ РегистрНакопления.Продажи\n;\n"
    solution: ВЫБРАТЬ СУММА(Сумма) КАК Итого ПОМЕСТИТЬ втВсего ИЗ РегистрНакопления.Продажи; ВЫБРАТЬ П.Контрагент, СУММА(П.Сумма) * 100 / МАКСИМУМ(Всего.Итого) КАК Доля ИЗ РегистрНакопления.Продажи КАК П ВНУТРЕННЕЕ СОЕДИНЕНИЕ втВсего КАК Всего ПО ИСТИНА СГРУППИРОВАТЬ ПО П.Контрагент
    hints: ["Таблицу из одной строки присоединяют по условию `ПО ИСТИНА`.", "Итого одинаково для всей группы — его можно взять через МАКСИМУМ(Всего.Итого) или добавить в группировку."]
  - id: q-temp-both
    title: Купили и ноутбук, и смартфон
    difficulty: 3
    text: "Контрагенты, которые покупали и `&ТоварА`, и `&ТоварБ` (по регистру Продажи). Сделай две временные таблицы с покупателями каждого товара и соедини их. Одна колонка: **Контрагент**."
    params: { ТоварА: Справочник.Номенклатура.Ноутбук, ТоварБ: Справочник.Номенклатура.Смартфон }
    starter: "ВЫБРАТЬ РАЗЛИЧНЫЕ Контрагент\nПОМЕСТИТЬ втА\nИЗ РегистрНакопления.Продажи\nГДЕ Номенклатура = &ТоварА\n;\n"
    solution: ВЫБРАТЬ РАЗЛИЧНЫЕ Контрагент ПОМЕСТИТЬ втА ИЗ РегистрНакопления.Продажи ГДЕ Номенклатура = &ТоварА; ВЫБРАТЬ РАЗЛИЧНЫЕ Контрагент ПОМЕСТИТЬ втБ ИЗ РегистрНакопления.Продажи ГДЕ Номенклатура = &ТоварБ; ВЫБРАТЬ втА.Контрагент ИЗ втА ВНУТРЕННЕЕ СОЕДИНЕНИЕ втБ ПО втА.Контрагент = втБ.Контрагент
    hints: ["Внутреннее соединение двух списков оставит только тех, кто есть в обоих."]
  - id: q-temp-drop
    title: Уничтожить за собой
    difficulty: 2
    text: "Пакет из трёх запросов: 1) **втКрупные** — проведённые реализации с суммой больше 1 500 000 (Ссылка, СуммаДокумента); 2) выбрать из неё **Ссылка**, **СуммаДокумента**; 3) уничтожить временную таблицу."
    require: [{ pattern: "УНИЧТОЖИТЬ", message: "Третьим запросом уничтожь временную таблицу: УНИЧТОЖИТЬ втКрупные" }]
    starter: "ВЫБРАТЬ Ссылка, СуммаДокумента\nПОМЕСТИТЬ втКрупные\nИЗ Документ.РеализацияТоваров\nГДЕ Проведен И СуммаДокумента > 1500000\n;\n"
    solution: ВЫБРАТЬ Ссылка, СуммаДокумента ПОМЕСТИТЬ втКрупные ИЗ Документ.РеализацияТоваров ГДЕ Проведен И СуммаДокумента > 1500000; ВЫБРАТЬ Ссылка, СуммаДокумента ИЗ втКрупные; УНИЧТОЖИТЬ втКрупные
    hints: ["`УНИЧТОЖИТЬ ИмяТаблицы` — отдельный запрос пакета, отделяется «;»."]
