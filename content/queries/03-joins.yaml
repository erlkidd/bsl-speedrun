topic: Соединения и объединения
kb: queries/zapros-soedineniya
tasks:
  - id: q-join-lines
    title: Строки с датой документа
    difficulty: 2
    text: "Строки табличной части **Товары** проведённых реализаций: **Дата** документа, **Номенклатура**, **Количество**, **Сумма**."
    starter: "ВЫБРАТЬ\n    Док.Дата,\n    Стр.Номенклатура,\n    Стр.Количество,\n    Стр.Сумма\nИЗ Документ.РеализацияТоваров.Товары КАК Стр\n    "
    solution: ВЫБРАТЬ Док.Дата, Стр.Номенклатура, Стр.Количество, Стр.Сумма ИЗ Документ.РеализацияТоваров.Товары КАК Стр ВНУТРЕННЕЕ СОЕДИНЕНИЕ Документ.РеализацияТоваров КАК Док ПО Стр.Ссылка = Док.Ссылка ГДЕ Док.Проведен
    hints: ["Табличная часть — отдельная таблица `Документ.РеализацияТоваров.Товары`; её поле `Ссылка` указывает на документ."]
  - id: q-join-noSales
    title: Покупатели без покупок
    difficulty: 2
    text: "**Наименование** контрагентов-покупателей (не поставщиков), по которым нет ни одного документа реализации."
    starter: "ВЫБРАТЬ\n    Контр.Наименование\nИЗ Справочник.Контрагенты КАК Контр\n    "
    solution: ВЫБРАТЬ Контр.Наименование ИЗ Справочник.Контрагенты КАК Контр ЛЕВОЕ СОЕДИНЕНИЕ Документ.РеализацияТоваров КАК Док ПО Док.Контрагент = Контр.Ссылка ГДЕ Док.Ссылка ЕСТЬ NULL И НЕ Контр.ЭтоПоставщик
    hints: ["Левое соединение + `ГДЕ Док.Ссылка ЕСТЬ NULL` оставляет строки, которым пары не нашлось.", "Второй путь: `ГДЕ НЕ Контр.Ссылка В (ВЫБРАТЬ Контрагент ИЗ Документ.РеализацияТоваров)`."]
  - id: q-join-count
    title: Документы каждого сотрудника
    difficulty: 3
    text: "Для **каждого** сотрудника — число документов реализации, где он ответственный. Сотрудники без документов — с нулём. Колонки: **Сотрудник** (наименование), **Документов**."
    starter: "ВЫБРАТЬ\n    Сотр.Наименование КАК Сотрудник,\n    \nИЗ Справочник.Сотрудники КАК Сотр\n    "
    solution: ВЫБРАТЬ Сотр.Наименование КАК Сотрудник, КОЛИЧЕСТВО(Док.Ссылка) КАК Документов ИЗ Справочник.Сотрудники КАК Сотр ЛЕВОЕ СОЕДИНЕНИЕ Документ.РеализацияТоваров КАК Док ПО Док.Ответственный = Сотр.Ссылка СГРУППИРОВАТЬ ПО Сотр.Наименование
    hints: ["`КОЛИЧЕСТВО(Док.Ссылка)` пропускает NULL, поэтому у сотрудника без документов будет 0."]
  - id: q-join-union
    title: Общий журнал документов
    difficulty: 2
    text: "Единый список проведённых поступлений и реализаций за `&Начало`…`&Конец`: **Вид** (строка «Поступление» или «Реализация»), **Номер**, **СуммаДокумента**."
    params: { Начало: "01.02.2026", Конец: "28.02.2026 23:59:59" }
    starter: "ВЫБРАТЬ \"Поступление\" КАК Вид, Номер, СуммаДокумента\nИЗ Документ.ПоступлениеТоваров\nГДЕ Проведен И Дата МЕЖДУ &Начало И &Конец\n\n"
    solution: ВЫБРАТЬ "Поступление" КАК Вид, Номер, СуммаДокумента ИЗ Документ.ПоступлениеТоваров ГДЕ Проведен И Дата МЕЖДУ &Начало И &Конец ОБЪЕДИНИТЬ ВСЕ ВЫБРАТЬ "Реализация", Номер, СуммаДокумента ИЗ Документ.РеализацияТоваров ГДЕ Проведен И Дата МЕЖДУ &Начало И &Конец
    hints: ["`ОБЪЕДИНИТЬ ВСЕ` склеивает результаты двух запросов; число и порядок полей должны совпадать.", "Имена колонок берутся из первого запроса."]
  - id: q-join-on-vs-where
    title: Условие в ПО, а не в ГДЕ
    difficulty: 3
    text: "Для **каждого** склада посчитай количество реализаций за `&Начало`…`&Конец`. Склады без реализаций в этом периоде должны остаться с нулём. Колонки: **Склад** (наименование), **Документов**."
    params: { Начало: "01.06.2026", Конец: "30.06.2026 23:59:59" }
    starter: "ВЫБРАТЬ\n    Скл.Наименование КАК Склад,\n    КОЛИЧЕСТВО(Док.Ссылка) КАК Документов\nИЗ Справочник.Склады КАК Скл\n    ЛЕВОЕ СОЕДИНЕНИЕ Документ.РеализацияТоваров КАК Док\n    ПО Док.Склад = Скл.Ссылка\nГДЕ Док.Дата МЕЖДУ &Начало И &Конец\nСГРУППИРОВАТЬ ПО Скл.Наименование"
    solution: ВЫБРАТЬ Скл.Наименование КАК Склад, КОЛИЧЕСТВО(Док.Ссылка) КАК Документов ИЗ Справочник.Склады КАК Скл ЛЕВОЕ СОЕДИНЕНИЕ Документ.РеализацияТоваров КАК Док ПО Док.Склад = Скл.Ссылка И Док.Дата МЕЖДУ &Начало И &Конец СГРУППИРОВАТЬ ПО Скл.Наименование
    hints: ["Условие на правую таблицу в ГДЕ отбрасывает строки с NULL — левое соединение превращается во внутреннее.", "Перенеси условие по дате в ПО: `ПО Док.Склад = Скл.Ссылка И Док.Дата МЕЖДУ …`."]
