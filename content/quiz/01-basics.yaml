topic: Основы языка BSL
questions:
  - q: С какого индекса нумеруются элементы массива в BSL?
    options: ["0", "1", "Зависит от настройки конфигурации", "-1"]
    answer: 0
    explain: Индексы массива начинаются с 0 (`Массив[0]` — первый элемент). А вот позиции символов в строке (`Сред`, `СтрНайти`) начинаются с 1 — частая путаница.
    kb: general/kollekcii

  - q: С какой позиции нумеруются символы в строке для функции `Сред()`?
    options: ["0", "1", "Любой, параметр по умолчанию 0", "Строки не индексируются"]
    answer: 1
    explain: '`Сред("Привет", 1, 1)` вернёт "П". Позиции в строковых функциях начинаются с 1, в отличие от индексов массивов.'

  - q: Что вернёт выражение `Соответствие["нет такого ключа"]`?
    options: ["Ошибку «Ключ не найден»", "Пустую строку", "Неопределено", "Null"]
    answer: 2
    explain: Обращение к отсутствующему ключу соответствия через `[]` возвращает `Неопределено` без исключения. У Структуры обращение `Структура.НетКлюча` вызовет ошибку — для неё есть `Свойство()`.

  - q: Как правильно проверить, есть ли ключ в Структуре, не получив исключение?
    options: ["Структура.Найти(\"Ключ\")", "Структура.Свойство(\"Ключ\")", "Структура[\"Ключ\"] <> Неопределено", "ЕстьКлюч(Структура, \"Ключ\")"]
    answer: 1
    explain: '`Свойство(Ключ, Значение)` возвращает Истина/Ложь и опционально кладёт значение во второй параметр. Обращение `Структура["Ключ"]` при отсутствии ключа вызывает исключение.'

  - q: Что делает модификатор `Знач` у параметра процедуры?
    options: ["Делает параметр обязательным", "Передаёт параметр по значению — изменение переменной внутри не влияет на вызывающий код", "Запрещает изменять параметр внутри метода", "Объявляет параметр как константу"]
    answer: 1
    explain: По умолчанию параметры передаются по ссылке. `Знач` передаёт копию значения переменной. Для объектов (массив, структура) копируется ссылка — содержимое объекта по-прежнему можно изменить, но присвоение новой переменной наружу не уйдёт.

  - q: Что выведет код `А = 10; Б = "5"; Сообщить(А + Б);`?
    options: ["15", "105", "Ошибка преобразования", "\"10\" + \"5\""]
    answer: 0
    explain: Тип результата определяет левый операнд. Слева Число, поэтому строка "5" приводится к числу → 15. Если поменять местами (`Б + А`), получится строка "510".

  - q: Чем результат `?(Условие, А, Б)` отличается от `Если ... Тогда ... КонецЕсли`?
    options: ["Ничем, это синоним", "Это выражение — возвращает значение и вычисляет только нужную ветку", "Вычисляет обе ветки, затем выбирает", "Работает только на клиенте"]
    answer: 1
    explain: '`?()` — тернарный оператор, это выражение, его можно использовать справа от `=`. Вычисляется только выбранная ветка.'

  - q: Что делает `ВызватьИсключение;` без параметров внутри блока `Исключение`?
    options: ["Ничего", "Создаёт пустое исключение", "Перевыбрасывает текущее исключение дальше", "Синтаксическая ошибка"]
    answer: 2
    explain: Без параметров внутри `Исключение ... КонецПопытки` оператор пробрасывает исходную ошибку выше с сохранением информации о ней. Вне блока обработки так писать нельзя.
