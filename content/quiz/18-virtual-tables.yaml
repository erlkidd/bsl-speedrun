topic: Регистры сведений и накопления в запросах
questions:
- q: Что возвращает `РегистрСведений.КурсыВалют.СрезПоследних(&Дата)`?
  options:
  - Все записи до даты
  - По каждой валюте — одну запись с самым поздним периодом не позже даты
  - Одну запись на весь регистр
  - Записи ровно за эту дату
  answer: 1
  explain: Срез — по одной записи на каждое сочетание измерений.
  kb: queries/registry-nakopleniya
- q: Запрос `…СрезПоследних() ГДЕ Период <= &Дата`. В чём ошибка?
  options:
  - Ошибки нет
  - Срез без даты берёт самые свежие записи, а ГДЕ потом выкидывает те, что позже даты — вместо «значение на дату» получаем пропуски
  - Нельзя использовать ГДЕ со срезом
  - Период нельзя сравнивать
  answer: 1
  explain: Дату передают первым параметром виртуальной таблицы.
  kb: queries/registry-nakopleniya
- q: Есть ли `СрезПоследних` у непериодического регистра сведений?
  options:
  - Да
  - 'Нет: у него нет поля Период и срезов, читают саму таблицу регистра'
  - Только СрезПервых
  - Только с отбором по регистратору
  answer: 1
  explain: Срезы имеют смысл только там, где есть история значений во времени.
  kb: queries/registry-nakopleniya
- q: Как называется ресурс `Количество` в виртуальной таблице `Остатки`?
  options:
  - '`Количество`'
  - '`КоличествоОстаток`'
  - '`ОстатокКоличество`'
  - '`Количество.Остаток`'
  answer: 1
  explain: 'К имени ресурса добавляется суффикс: Остаток, Оборот, Приход, Расход, НачальныйОстаток, КонечныйОстаток.'
  kb: queries/registry-nakopleniya
- q: Почему отбор по измерению пишут в параметрах `Остатки(, Склад = &Склад)`, а не в `ГДЕ`?
  options:
  - Иначе синтаксическая ошибка
  - Условие в параметрах применяется до расчёта остатков; с ГДЕ СУБД считает остатки по всему регистру и лишь затем отбрасывает лишнее
  - В ГДЕ нельзя использовать параметры
  - Разницы нет
  answer: 1
  explain: Результат одинаковый, а время — нет. Это пункт стандартов и частый вопрос на собеседовании.
  kb: queries/registry-nakopleniya
- q: У регистра измерения Номенклатура и Склад. Запрос выбирает из `Остатки()` только Номенклатуру и КоличествоОстаток. Что будет со складами?
  options:
  - Ошибка
  - Остаток свернётся по всем складам — по одной строке на номенклатуру
  - Строки продублируются по складам
  - Вернётся только первый склад
  answer: 1
  explain: Виртуальная таблица группирует по тем измерениям, которые реально используются в запросе.
  kb: queries/registry-nakopleniya
- q: У какого вида регистра накопления есть виртуальная таблица `Остатки`?
  options:
  - У любого
  - Только у регистра остатков; у оборотного — только `Обороты`
  - Только у оборотного
  - Ни у какого
  answer: 1
  explain: Оборотный регистр не хранит вид движения «приход/расход», остаток для него не определён.
  kb: queries/registry-nakopleniya
- q: Какие параметры у `Обороты` регистра накопления?
  options:
  - Период, Условие
  - НачалоПериода, КонецПериода, Периодичность, Условие
  - Только Условие
  - Дата, Регистратор
  answer: 1
  explain: Периодичность (День, Месяц, Регистратор…) добавляет в результат поле Период.
  kb: queries/registry-nakopleniya
- q: Что даёт `Остатки(&Дата)` — входят ли движения самой этой секунды?
  options:
  - Входят
  - 'Не входят: остаток считается на начало указанного момента'
  - Зависит от СУБД
  - Входят только приходы
  answer: 1
  explain: Чтобы включить движения на дату, передают `Граница(Дата, ВидГраницы.Включая)` или конец дня.
  kb: queries/registry-nakopleniya
- q: Какие поля возвращает `ОстаткиИОбороты`?
  options:
  - Только остатки
  - Начальный остаток, приход, расход, оборот и конечный остаток по каждому ресурсу
  - Только обороты
  - Движения по документам
  answer: 1
  explain: '`КоличествоНачальныйОстаток`, `КоличествоПриход`, `КоличествоРасход`, `КоличествоОборот`, `КоличествоКонечныйОстаток`.'
  kb: queries/registry-nakopleniya
- q: Поле `Регистратор` у движений имеет составной тип. Чем опасно `Регистратор.Номер`?
  options:
  - Ничем
  - Платформа присоединит таблицы всех документов-регистраторов; нужно `ВЫРАЗИТЬ(Регистратор КАК Документ.Х).Номер`
  - Вернёт NULL всегда
  - Так писать нельзя синтаксически
  answer: 1
  explain: ВЫРАЗИТЬ сужает составной тип до одной таблицы — одно соединение вместо десятков.
  kb: queries/registry-nakopleniya
- q: Чем физическая таблица `РегистрНакопления.Продажи` отличается от `РегистрНакопления.Продажи.Обороты()`?
  options:
  - Ничем
  - Физическая — отдельные записи движений с регистратором; Обороты — уже свёрнутые суммы за период
  - Физическая недоступна в запросах
  - Обороты включают только приход
  answer: 1
  explain: К физической таблице обращаются, когда нужны сами движения; для итогов — виртуальные таблицы, они используют хранимые итоги.
  kb: queries/registry-nakopleniya
- q: Чем `СрезПервых(&Дата)` отличается от `СрезПоследних(&Дата)`?
  options:
  - Ничем
  - Берёт самую раннюю запись не раньше даты
  - Берёт записи до даты в обратном порядке
  - Работает только с числами
  answer: 1
  explain: СрезПоследних смотрит назад от даты, СрезПервых — вперёд.
  kb: queries/registry-nakopleniya
