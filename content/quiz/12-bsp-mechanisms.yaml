topic: Механизмы БСП
questions:
  - q: Где объявляют команды печати своего документа в БСП?
    options: ["В УправлениеПечатьюПереопределяемый", "В модуле менеджера документа, процедура `ДобавитьКомандыПечати(КомандыПечати)`", "Кнопкой на форме вручную", "В модуле объекта"]
    answer: 1
    explain: Библиотека сама собирает команды со всех объектов и выводит их в форму объекта, форму списка и подменю. Переопределяемый модуль нужен, чтобы вмешаться в уже собранный список.
    kb: bsp/pechat

  - q: Зачем в процедуре `Печать` менеджера вызывать `УправлениеПечатью.НужноПечататьМакет(...)`?
    options: ["Это обязательный синтаксис", "Пользователь мог снять галку с этой формы — без проверки макет сформируется впустую", "Чтобы проверить права", "Чтобы отправить на принтер"]
    answer: 1
    explain: Готовый табличный документ кладут в коллекцию через `ВывестиТабличныйДокументВКоллекцию`, а не возвращают из процедуры — печатью управляет библиотека.
    kb: bsp/pechat

  - q: Как с клиента выполнить печать так же, как типовая команда?
    options: ["Вызвать серверный УправлениеПечатью", "`УправлениеПечатьюКлиент.ВыполнитьКомандуПечати(ИмяМенеджера, ИменаМакетов, МассивОбъектов, ВладелецФормы)`", "ТабличныйДокумент.Напечатать()", "ОткрытьФорму печати"]
    answer: 1
    explain: С клиента печать идёт через модуль с суффиксом `Клиент`. Серверный `УправлениеПечатью` из клиентского обработчика недоступен.
    kb: bsp/pechat

  - q: Как правильно выключить регламентное задание из кода в конфигурации на БСП?
    options: ["Изменить Задание.Использование и записать", "`РегламентныеЗаданияСервер.УстановитьИспользованиеРегламентногоЗадания(Метаданные.РегламентныеЗадания.Имя, Ложь)`", "Удалить объект метаданных", "Через РегламентныеЗадания.НайтиРегламентныеЗадания"]
    answer: 1
    explain: Функции библиотеки работают и в локальном режиме, и в модели сервиса (там задания лежат в очереди заданий). Прямая правка свойства задания в модели сервиса не даст эффекта.
    kb: bsp/reglamentnye-zadaniya

  - q: Чем регламентное задание отличается от длительной операции?
    options: ["Ничем", "Регламентное задание запускает планировщик по расписанию без пользователя; длительную операцию запускает действие пользователя, а форма ждёт результат", "Длительная операция выполняется на клиенте", "Регламентное задание выполняется только ночью"]
    answer: 1
    explain: Механизмы разные и модули разные — `РегламентныеЗаданияСервер` и `ДлительныеОперации` / `ДлительныеОперацииКлиент`.
    kb: bsp/reglamentnye-zadaniya

  - q: Где объявляют свой обработчик обновления информационной базы?
    options: ["В модуле сеанса", "В процедуре `ПриДобавленииОбработчиковОбновления(Обработчики)` общего модуля своей подсистемы", "В ОбновлениеИнформационнойБазыПереопределяемый", "При начале работы системы"]
    answer: 1
    explain: Библиотека собирает обработчики со всех подсистем и выполняет их по версиям. Переопределяемый модуль отвечает за порядок и события вокруг обновления, а не за перечень обработчиков.
    kb: bsp/obnovlenie-ib

  - q: Сколько раз выполняется обработчик обновления с указанной версией?
    options: ["При каждом входе пользователя", "Один раз при переходе на эту версию конфигурации", "Каждую ночь", "Пока не вернёт Истина"]
    answer: 1
    explain: Поэтому менять данные «на всякий случай» при каждом входе (в модуле сеанса) неправильно — для разовой миграции данных и нужен обработчик обновления.
    kb: bsp/obnovlenie-ib

  - q: Как проверить, что пользователь может изменять КОНКРЕТНЫЙ документ (с учётом ограничений на уровне записей)?
    options: ["ПравоДоступа(\"Изменение\", Метаданные.Документы.Заказ)", "`УправлениеДоступом.ЕстьПраво(\"Изменение\", Ссылка)`", "Проверить роль пользователя", "Попробовать записать"]
    answer: 1
    explain: Платформенная `ПравоДоступа` отвечает про вид объекта целиком и ничего не знает про ограничения на уровне записей. Ветвление по роли — крайняя мера, полноту прав проверяют `Пользователи.ЭтоПолноправныйПользователь`.

  - q: Код должен работать и во внедрении, где подсистемы БСП может не быть. Как вызвать её модуль?
    options: ["Обращаться напрямую, ошибки не будет", "Проверить `ОбщегоНазначения.ПодсистемаСуществует(\"СтандартныеПодсистемы.Имя\")` и получить модуль через `ОбщегоНазначения.ОбщийМодуль(\"ИмяМодуля\")`", "Через Выполнить()", "Скопировать модуль к себе"]
    answer: 1
    explain: Прямое обращение к несуществующему модулю — ошибка компиляции. Условный вызов через `ПодсистемаСуществует` + `ОбщийМодуль` — стандартный приём БСП.
