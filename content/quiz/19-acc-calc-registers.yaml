topic: Регистры бухгалтерии и расчёта в запросах
questions:
- q: Куда в `РегистрБухгалтерии.Хозрасчетный.Остатки(…)` пишут условие по счёту?
  options:
  - В ГДЕ
  - 'Во второй параметр — УсловиеСчета: `Остатки(&Дата, Счет = &Счет, , )`'
  - В третий параметр Субконто
  - В первый параметр
  answer: 1
  explain: 'Параметры: Период, УсловиеСчета, Субконто, Условие. Сдвинешь позицию — отбор молча не сработает.'
  kb: queries/registry-buhgalterii
- q: Что передают в параметр `Субконто` виртуальных таблиц регистра бухгалтерии?
  options:
  - Значение субконто, например контрагента
  - Виды субконто (массив ссылок плана видов характеристик) — они определяют, чем будут Субконто1, Субконто2
  - Номер субконто
  - Строку с именем
  answer: 1
  explain: 'Отбор по значению субконто пишут в параметре Условие: `Субконто1 = &Контрагент`.'
  kb: queries/registry-buhgalterii
- q: Чем `СуммаОстатокДт` отличается от `СуммаОстаток`?
  options:
  - Ничем
  - '`СуммаОстаток` — сальдо со знаком (Дт минус Кт), `СуммаОстатокДт` — только дебетовое сальдо, для кредитового там 0'
  - Дт — это оборот
  - Дт всегда больше
  answer: 1
  explain: У ресурсов регистра бухгалтерии есть варианты с суффиксами Дт и Кт.
  kb: queries/registry-buhgalterii
- q: Какая виртуальная таблица показывает обороты между парами счетов?
  options:
  - Остатки
  - ОборотыДтКт
  - СрезПоследних
  - ОстаткиИОбороты
  answer: 1
  explain: '`ОборотыДтКт` возвращает СчетДт, СчетКт, их субконто и СуммаОборот — готовая «шахматка».'
  kb: queries/registry-buhgalterii
- q: Как отобрать обороты по счёту 90 вместе с субсчетами 90.01 и 90.02?
  options:
  - '`Счет = &Счет90`'
  - '`Счет В ИЕРАРХИИ (&Счет90)`'
  - '`Счет ПОДОБНО "90%"`'
  - Никак
  answer: 1
  explain: 'План счетов иерархический: субсчета подчинены счёту-группе. Сравнение `=` найдёт проводки только по самому счёту 90.'
  kb: queries/registry-buhgalterii
- q: Одна проводка Дт 41.01 Кт 60.01 на 1000. Как она отразится в таблице `Обороты` по счетам?
  options:
  - Одной строкой
  - 'Двумя: по счёту 41.01 — оборот Дт 1000, по счёту 60.01 — оборот Кт 1000'
  - Никак
  - Четырьмя строками
  answer: 1
  explain: Проводка затрагивает два счёта, и в оборотах каждого из них видна своей стороной.
  kb: queries/registry-buhgalterii
- q: Что такое «период регистрации» в регистре расчёта?
  options:
  - Дата документа
  - Месяц, в котором запись зарегистрирована (в каком расчётном периоде начислено)
  - Даты отпуска
  - Время записи в базу
  answer: 1
  explain: Период действия — за какие даты начислено; период регистрации — когда. Отпуск за март, начисленный в апреле, имеет период регистрации «апрель».
  kb: queries/registry-buhgalterii
- q: Что означает запись с признаком `Сторно` в регистре расчёта?
  options:
  - Запись удалена
  - Запись отменяет ранее сделанное начисление — обычно с обратным знаком результата
  - Запись ещё не рассчитана
  - Запись для другого сотрудника
  answer: 1
  explain: 'Перерасчёт прошлого периода оформляют парой: сторно старого результата и новая запись.'
  kb: queries/registry-buhgalterii
- q: Чем план видов расчёта отличается от обычного справочника?
  options:
  - Ничем
  - 'Виды расчёта хранят связи между собой: базовые, вытесняющие и ведущие виды расчёта'
  - Он хранит только числа
  - Его нельзя использовать в запросах
  answer: 1
  explain: На этих связях построены расчёт базы, вытеснение по периоду действия и перерасчёты.
  kb: queries/registry-buhgalterii
- q: Как в запросе сослаться на предопределённый вид расчёта «Оклад»?
  options:
  - '`"Оклад"`'
  - '`ЗНАЧЕНИЕ(ПланВидовРасчета.Начисления.Оклад)`'
  - '`ВидРасчета.Оклад`'
  - '`&Оклад` без установки параметра'
  answer: 1
  explain: Как и для любых предопределённых данных — через ЗНАЧЕНИЕ().
  kb: queries/registry-buhgalterii
- q: Почему остатки по счёту нельзя получить, просто сложив поле `Сумма` физической таблицы регистра бухгалтерии?
  options:
  - Можно
  - 'В записи одна сумма относится сразу к двум счетам: в дебет одного и в кредит другого. Нужна развёртка по сторонам — её делает виртуальная таблица'
  - Поле Сумма недоступно
  - Суммы хранятся в копейках
  answer: 1
  explain: Физическая таблица — журнал проводок. Остатки и обороты по счёту дают виртуальные таблицы.
  kb: queries/registry-buhgalterii
