topic: Платформа, запросы, клиент-сервер
questions:
  - q: Почему запрос в цикле — плохая практика?
    options: ["Запросы в цикле запрещены синтаксисом", "Каждая итерация — отдельное обращение к СУБД; лучше один пакетный запрос с соединением или параметром-списком", "Запрос внутри цикла всегда выполняется на клиенте", "Из-за ограничения лицензии"]
    answer: 1
    explain: N итераций = N обращений к серверу СУБД со всеми накладными расходами. Обычно данные получают одним запросом (параметр-массив, временная таблица, соединение), а в цикле работают с результатом.

  - q: Чем `ЛЕВОЕ СОЕДИНЕНИЕ` отличается от `ВНУТРЕННЕЕ СОЕДИНЕНИЕ`?
    options: ["Ничем", "Левое оставляет все строки левой таблицы, даже без пары справа (поля справа будут NULL)", "Левое быстрее всегда", "Внутреннее оставляет все строки обеих таблиц"]
    answer: 1
    explain: Внутреннее соединение оставляет только строки, нашедшие пару. Левое — все строки левой таблицы; у не нашедших пару поля правой таблицы равны NULL — их часто обрабатывают через `ЕСТЬNULL()`.

  - q: Зачем у виртуальной таблицы `Остатки` задают параметры, а не условие в `ГДЕ`?
    options: ["Это одно и то же", "Параметры фильтруют данные до расчёта остатков — быстрее и корректнее", "В ГДЕ нельзя использовать измерения", "Параметры работают только в СКД"]
    answer: 1
    explain: Условие в параметрах виртуальной таблицы накладывается до агрегирования и попадает в отбор по индексам. Условие в `ГДЕ` применяется уже к рассчитанному результату, что медленнее, а для некоторых таблиц (например, ОстаткиИОбороты) даёт другие цифры.

  - q: Что означает директива `&НаСервереБезКонтекста`?
    options: ["Метод выполняется на клиенте без формы", "Метод выполняется на сервере, без передачи данных формы — вызов дешевле", "Метод доступен только администратору", "Метод выполняется в фоне"]
    answer: 1
    explain: При вызове `&НаСервере` на сервер передаются данные формы (контекст). `&НаСервереБезКонтекста` их не передаёт — нельзя обращаться к реквизитам формы, зато вызов легче. Предпочтительный вариант, если контекст не нужен.

  - q: Что произойдёт с изменениями при исключении внутри `НачатьТранзакцию()` ... `ЗафиксироватьТранзакцию()` без `ОтменитьТранзакцию()`?
    options: ["Изменения сохранятся частично", "Транзакция останется открытой и её нужно отменить — правильный шаблон: Попытка ... Исключение ОтменитьТранзакцию(); ВызватьИсключение; КонецПопытки", "Платформа зафиксирует транзакцию автоматически", "Ничего, исключение будет проигнорировано"]
    answer: 1
    explain: Стандарт 1С требует, чтобы на каждый `НачатьТранзакцию()` был ровно один `ЗафиксироватьТранзакцию()` или `ОтменитьТранзакцию()`. Шаблон — `НачатьТранзакцию(); Попытка ... ЗафиксироватьТранзакцию(); Исключение ОтменитьТранзакцию(); ВызватьИсключение; КонецПопытки;`.

  - q: Для чего нужна управляемая блокировка `БлокировкаДанных`?
    options: ["Чтобы заблокировать форму от редактирования", "Чтобы предотвратить одновременное изменение/чтение одних и тех же данных разными транзакциями (например, списание остатков)", "Чтобы запретить пользователю вход", "Для шифрования данных"]
    answer: 1
    explain: Управляемая блокировка ставится в транзакции до чтения данных, которые будут использоваться для записи (например, остатков при проведении), чтобы две транзакции не списали один и тот же остаток.

  - q: Где выполняется код в обработчике `ПриСозданииНаСервере` формы?
    options: ["На клиенте", "На сервере", "И на клиенте, и на сервере", "В фоновом задании"]
    answer: 1
    explain: Это серверный обработчик формы — в нём доступны серверные объекты и данные формы. Клиентские методы (например, открытие других форм) из него вызвать нельзя.
