topic: Метаданные, модули и формы
questions:
  - q: Для чего нужен модуль менеджера объекта?
    options: ["Для обработчиков событий конкретного элемента", "Для процедур и функций, относящихся к объекту в целом, а не к экземпляру: печать, обработка получения формы, общие методы", "Для кода, который выполняется на клиенте", "Для хранения настроек"]
    answer: 1
    explain: Модуль объекта работает с конкретным экземпляром (`ЭтотОбъект`). Модуль менеджера вызывается через менеджер (`Справочники.Номенклатура.МойМетод()`) — там пишут код, не завязанный на один элемент.

  - q: Что такое определяемый тип?
    options: ["Тип, который определяет пользователь в режиме Предприятия", "Объект метаданных, задающий набор типов, который используют в реквизитах; при изменении состава меняется во всех местах", "Тип данных из внешней компоненты", "Синоним типа Произвольный"]
    answer: 1
    explain: Определяемые типы активно использует БСП — например, «Организация», «ВладелецФайлов». Конфигурация добавляет свои типы в определяемый тип, а не правит каждый реквизит.

  - q: Чем план видов характеристик отличается от справочника?
    options: ["Ничем", "Элемент ПВХ описывает характеристику и тип её значения; используется для произвольных свойств и субконто", "ПВХ не может иметь реквизитов", "ПВХ хранится только в памяти"]
    answer: 1
    explain: У элемента ПВХ есть «тип значения характеристики». Так реализуют дополнительные реквизиты, виды субконто в плане счетов и т.п.

  - q: Чем `ПриСозданииНаСервере` отличается от `ПриОткрытии`?
    options: ["Ничем", "`ПриСозданииНаСервере` — сервер, вызывается один раз при создании формы, есть доступ к данным; `ПриОткрытии` — клиент, перед показом формы", "`ПриОткрытии` выполняется на сервере", "`ПриСозданииНаСервере` вызывается при каждой активизации окна"]
    answer: 1
    explain: Данные из базы, настройку элементов и параметров формы делают в `ПриСозданииНаСервере`. В `ПриОткрытии` — только клиентские вещи, без лишних серверных вызовов.

  - q: Что такое «чрезмерные клиент-серверные вызовы»?
    options: ["Слишком много пользователей", "Много мелких вызовов сервера с клиента вместо одного — каждый вызов это сетевой обмен и передача контекста формы", "Ошибка лицензирования", "Запросы в цикле на сервере"]
    answer: 1
    explain: Типичный пример — обращение к реквизиту ссылки через точку на клиенте или вызов `&НаСервере` в цикле. Лечится объединением логики в один серверный вызов и `&НаСервереБезКонтекста`.

  - q: Где задают первоначальное значение параметра сеанса?
    options: ["В модуле формы", "В модуле сеанса, в обработчике `УстановкаПараметровСеанса`", "В модуле приложения ПриНачалеРаботыСистемы", "В конфигураторе в свойствах параметра"]
    answer: 1
    explain: Параметры сеанса устанавливаются на сервере в модуле сеанса. Обработчик `УстановкаПараметровСеанса(ИменаПараметров)` вызывается в том числе при первом обращении к ещё не установленному параметру.
