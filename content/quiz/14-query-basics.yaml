topic: 'Запросы: основы выборки'
questions:
- q: В каком порядке идут разделы запроса?
  options:
  - ИЗ → ВЫБРАТЬ → ГДЕ → УПОРЯДОЧИТЬ ПО
  - ВЫБРАТЬ → ИЗ → ГДЕ → СГРУППИРОВАТЬ ПО → ИМЕЮЩИЕ → УПОРЯДОЧИТЬ ПО
  - ВЫБРАТЬ → ГДЕ → ИЗ → СГРУППИРОВАТЬ ПО
  - Порядок произвольный
  answer: 1
  explain: Порядок разделов жёсткий. Перестановка — синтаксическая ошибка.
  kb: queries/zapros-osnovy
- q: Как ограничить результат десятью строками?
  options:
  - '`LIMIT 10` в конце запроса'
  - '`ВЫБРАТЬ ПЕРВЫЕ 10 …`'
  - '`ГДЕ НомерСтроки <= 10`'
  - '`ИМЕЮЩИЕ КОЛИЧЕСТВО(*) <= 10`'
  answer: 1
  explain: 'В языке запросов 1С нет LIMIT. Ограничение пишут сразу после ВЫБРАТЬ: `ПЕРВЫЕ N`. Без `УПОРЯДОЧИТЬ ПО` состав этих строк не определён.'
  kb: queries/zapros-osnovy
- q: Что делает `ВЫБРАТЬ РАЗЛИЧНЫЕ`?
  options:
  - Убирает из результата повторяющиеся строки
  - Выбирает только строки с разными ссылками
  - Отключает проверку прав
  - Сортирует результат
  answer: 0
  explain: РАЗЛИЧНЫЕ сравнивает строки результата целиком и оставляет по одной из одинаковых.
  kb: queries/zapros-osnovy
- q: Как проверить, что поле после соединения пустое (NULL)?
  options:
  - '`Поле = NULL`'
  - '`Поле ЕСТЬ NULL`'
  - '`Поле = Неопределено`'
  - '`ПустаяСсылка(Поле)`'
  answer: 1
  explain: Любое сравнение с NULL через `=` даёт не истину и не ложь, а NULL — строка не пройдёт отбор. Проверяют только `ЕСТЬ NULL` / `ЕСТЬ НЕ NULL`.
  kb: queries/zapros-osnovy
- q: Что вернёт `ГДЕ Наименование ПОДОБНО "Чай"` (без знаков `%`)?
  options:
  - Все строки, где встречается «Чай»
  - Только строки, где наименование в точности «Чай»
  - Ошибку синтаксиса
  - Строки, начинающиеся с «Чай»
  answer: 1
  explain: Без спецсимволов ПОДОБНО работает как точное сравнение. `%` — любая последовательность символов, `_` — ровно один символ.
  kb: queries/zapros-osnovy
- q: Как в тексте запроса сослаться на значение перечисления?
  options:
  - '`Перечисление.ВидыНоменклатуры.Товар`'
  - '`ЗНАЧЕНИЕ(Перечисление.ВидыНоменклатуры.Товар)`'
  - '`"Товар"`'
  - '`&Перечисление.Товар`'
  answer: 1
  explain: Предопределённые значения (перечисления, предопределённые элементы, пустые ссылки) в тексте запроса пишут через `ЗНАЧЕНИЕ(…)`.
  kb: queries/zapros-osnovy
- q: Чем `Родитель = &Группа` отличается от `Ссылка В ИЕРАРХИИ (&Группа)`?
  options:
  - Ничем
  - Первое — только непосредственные потомки, второе — все уровни вложенности и сама группа
  - Первое быстрее, но результат тот же
  - Второе работает только для документов
  answer: 1
  explain: '`Родитель = …` — один уровень. `В ИЕРАРХИИ` — группа и всё, что в ней на любой глубине.'
  kb: queries/zapros-osnovy
- q: 'Какой оператор задаёт приоритет выше: `И` или `ИЛИ`?'
  options:
  - '`ИЛИ` выполняется раньше'
  - '`И` выполняется раньше, поэтому `А ИЛИ Б И В` = `А ИЛИ (Б И В)`'
  - Слева направо
  - Приоритет одинаковый
  answer: 1
  explain: 'Порядок: НЕ, затем И, затем ИЛИ. Если сомневаешься — ставь скобки.'
  kb: queries/zapros-osnovy
- q: Что означает `&Дата` в тексте запроса?
  options:
  - Системную функцию текущей даты
  - 'Параметр: значение задаётся снаружи через `Запрос.УстановитьПараметр("Дата", …)`'
  - Поле таблицы
  - Комментарий
  answer: 1
  explain: Амперсанд — признак параметра. Значения всегда передают параметрами, а не вклеивают в текст.
  kb: queries/zapros-osnovy
- q: Как записать литерал даты прямо в тексте запроса?
  options:
  - '`''2026-03-31''`'
  - '`ДАТАВРЕМЯ(2026, 3, 31)`'
  - '`Дата(2026, 3, 31)`'
  - '`"31.03.2026"`'
  answer: 1
  explain: В языке запросов дата записывается функцией `ДАТАВРЕМЯ(Год, Месяц, День[, Час, Минута, Секунда])`.
  kb: queries/zapros-osnovy
- q: Что делает обращение `Док.Контрагент.Город` в списке полей?
  options:
  - 'Ошибка: через две точки нельзя'
  - Платформа неявно присоединяет таблицу справочника контрагентов и берёт из неё Город
  - Возвращает строку «Контрагент.Город»
  - Работает только во вложенном запросе
  answer: 1
  explain: Обращение «через точку» от ссылочного поля — неявное левое соединение с таблицей, на которую ссылается поле.
  kb: queries/zapros-osnovy
- q: Включает ли `Дата МЕЖДУ &Нач И &Кон` границы интервала?
  options:
  - Нет, обе исключаются
  - Да, обе включаются
  - Только начало
  - Только конец
  answer: 1
  explain: 'МЕЖДУ — нестрогое сравнение с обеих сторон: `Дата >= &Нач И Дата <= &Кон`.'
  kb: queries/zapros-osnovy
- q: Запрос `ВЫБРАТЬ Наименование Город ИЗ Справочник.Контрагенты` (без запятой между полями). Что произойдёт?
  options:
  - Ошибка синтаксиса
  - Вернётся одна колонка с именем «Город», в которой лежат наименования
  - Вернутся две колонки
  - Вернётся пустой результат
  answer: 1
  explain: Слово после выражения без запятой — это псевдоним (КАК можно не писать). Пропущенная запятая молча превращает второе поле в имя первого.
  kb: queries/zapros-osnovy
