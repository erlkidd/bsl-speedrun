- q: "Товары: А, Б, В. Цены: (А, 10), (В, 30).\n\n```\nВЫБРАТЬ Тов.Имя, Цены.Цена\nИЗ Товары КАК Тов\n    ЛЕВОЕ СОЕДИНЕНИЕ Цены\n    ПО Тов.Имя = Цены.Имя\n```\nЧто в колонке Цена для товара Б?"
  options:
  - '0'
  - 'NULL'
  - Пустая строка
  - Строки с Б не будет
  answer: 1
  explain: Левое соединение сохраняет Б, а поля правой таблицы без пары заполняет NULL.
  kb: queries/zapros-chtenie
- q: "Товары: А, Б, В. Цены: (А, 10), (В, 30).\n\n```\nВЫБРАТЬ Тов.Имя\nИЗ Товары КАК Тов\n    ЛЕВОЕ СОЕДИНЕНИЕ Цены\n    ПО Тов.Имя = Цены.Имя\nГДЕ Цены.Цена > 5\n```\nСколько строк вернёт запрос?"
  options:
  - '3'
  - '2'
  - '1'
  - '0'
  answer: 1
  explain: Для Б цена NULL, условие `NULL > 5` не истинно — строка отброшена. Остаются А и В.
  kb: queries/zapros-chtenie
- q: 'Движения регистра остатков по товару: приход 10, расход 3, приход 5, расход 4.


    ```

    ВЫБРАТЬ КоличествоОстаток

    ИЗ РегистрНакопления.Товары.Остатки()

    ```

    Что вернёт запрос?'
  options:
  - '22'
  - '8'
  - '15'
  - '7'
  answer: 1
  explain: Остаток = приходы − расходы = (10 + 5) − (3 + 4) = 8.
  kb: queries/zapros-chtenie
- q: 'Курс записан: 01.03 — 498, 16.03 — 500, 01.04 — 502.


    ```

    ВЫБРАТЬ Курс

    ИЗ РегистрСведений.Курсы.СрезПоследних(ДАТАВРЕМЯ(2026, 3, 31))

    ```

    Результат?'
  options:
  - '498'
  - '500'
  - '502'
  - Три строки
  answer: 1
  explain: Самая поздняя запись не позже 31.03 — от 16.03.
  kb: queries/zapros-chtenie
- q: '```

    ВЫБРАТЬ Товар, СУММА(Сумма) КАК Сумма

    ПОМЕСТИТЬ втПродажи

    ИЗ Продажи

    СГРУППИРОВАТЬ ПО Товар

    ;

    ВЫБРАТЬ КОЛИЧЕСТВО(*) КАК Колво

    ИЗ втПродажи

    ```

    В таблице Продажи 100 строк по 7 разным товарам. Что вернёт пакет?'
  options:
  - '100'
  - '7'
  - 1 строку со значением 100
  - Ошибку
  answer: 1
  explain: Первый запрос кладёт во временную таблицу 7 строк (по одной на товар), второй считает их.
  kb: queries/zapros-chtenie
- q: "```\nВЫБРАТЬ\n    ВЫБОР\n        КОГДА Сумма >= 1000 ТОГДА \"Крупная\"\n        КОГДА Сумма >= 100 ТОГДА \"Средняя\"\n        ИНАЧЕ \"Мелкая\"\n    КОНЕЦ КАК Вид\nИЗ Документы\n```\nКакой Вид получит документ с суммой 1000?"
  options:
  - Средняя
  - Крупная
  - Мелкая
  - 'Обе: Крупная и Средняя'
  answer: 1
  explain: Ветки ВЫБОР проверяются сверху вниз, срабатывает первая истинная.
  kb: queries/zapros-chtenie
- q: '```

    ВЫБРАТЬ Имя ИЗ Клиенты

    ОБЪЕДИНИТЬ

    ВЫБРАТЬ Имя ИЗ Поставщики

    ```

    В клиентах: А, Б. В поставщиках: Б, В. Сколько строк?'
  options:
  - '4'
  - '3'
  - '2'
  - '1'
  answer: 1
  explain: '`ОБЪЕДИНИТЬ` без `ВСЕ` убирает дубликаты: А, Б, В. `ОБЪЕДИНИТЬ ВСЕ` вернул бы 4 строки.'
  kb: queries/zapros-chtenie
- q: '```

    ВЫБРАТЬ ПЕРВЫЕ 2 Имя, Оклад

    ИЗ Сотрудники

    УПОРЯДОЧИТЬ ПО Оклад УБЫВ

    ```

    Оклады: Анна 300, Борис 700, Вера 500. Кто попадёт в результат?'
  options:
  - Анна и Борис
  - Борис и Вера
  - Анна и Вера
  - Все трое
  answer: 1
  explain: Сначала сортировка по убыванию (Борис 700, Вера 500, Анна 300), затем берутся первые две строки.
