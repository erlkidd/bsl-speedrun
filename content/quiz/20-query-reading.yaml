topic: 'Запросы: читаем и предсказываем результат'
questions:
- q: 'Таблица `Т` (Товар, Цвет, Колво): (Чай, Зелёный, 2), (Чай, Чёрный, 5), (Кофе, Чёрный, 3).


    ```

    ВЫБРАТЬ Товар, СУММА(Колво) КАК Колво

    ИЗ Т

    СГРУППИРОВАТЬ ПО Товар

    ```

    Сколько строк в результате?'
  options:
  - '3'
  - '2'
  - '1'
  - '5'
  answer: 1
  explain: 'Группировка по товару: Чай (7) и Кофе (3).'
  kb: queries/zapros-chtenie
- q: 'Таблица `Т` (Товар, Цвет, Колво): (Чай, Зелёный, 2), (Чай, Чёрный, 5), (Кофе, Чёрный, 3).


    ```

    ВЫБРАТЬ Цвет, СУММА(Колво) КАК Колво

    ИЗ Т

    СГРУППИРОВАТЬ ПО Цвет

    ИМЕЮЩИЕ СУММА(Колво) > 5

    ```

    Что вернёт запрос?'
  options:
  - Зелёный 2 и Чёрный 8
  - Только Чёрный 8
  - Пусто
  - Чёрный 5 и Чёрный 3
  answer: 1
  explain: Зелёный = 2, Чёрный = 5 + 3 = 8. ИМЕЮЩИЕ оставляет группы с суммой больше 5.
  kb: queries/zapros-chtenie
- q: 'Таблица `Т` (Товар, Цвет, Колво): (Чай, Зелёный, 2), (Чай, Чёрный, 5), (Кофе, Чёрный, 3).


    ```

    ВЫБРАТЬ Товар, Колво

    ИЗ Т

    ГДЕ Колво > 2

    УПОРЯДОЧИТЬ ПО Колво УБЫВ

    ```

    Какая строка будет первой?'
  options:
  - Чай 2
  - Чай 5
  - Кофе 3
  - Чай 7
  answer: 1
  explain: ГДЕ оставляет (Чай, 5) и (Кофе, 3); сортировка по убыванию ставит первой строку с 5.
  kb: queries/zapros-chtenie
- q: 'Таблица `Т` (Товар, Цвет, Колво): (Чай, Зелёный, 2), (Чай, Чёрный, 5), (Кофе, Чёрный, 3).


    ```

    ВЫБРАТЬ РАЗЛИЧНЫЕ Цвет ИЗ Т

    ```

    Сколько строк?'
  options:
  - '3'
  - '2'
  - '1'
