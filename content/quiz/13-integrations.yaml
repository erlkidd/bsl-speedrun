topic: Интеграции и обмен данными
questions:
  - q: Какие способы интеграции 1С с внешними системами есть на уровне платформы?
    options: ["Только обмен файлами", "HTTP-сервисы и HTTP-запросы, веб-сервисы (SOAP), OData, COM-соединение, обмен файлами (XML, JSON)", "Только COM", "Только веб-сервисы"]
    answer: 1
    explain: Выбор зависит от задачи. Для REST-обмена с современными системами чаще всего — HTTP-сервисы (входящие) и `HTTPСоединение` (исходящие).
    kb: general/integracii

  - q: Как правильно вызывать внешний API из 1С?
    options: ["Внутри транзакции записи документа", "Вне транзакции, в `Попытка ... Исключение`, с ограниченным числом повторов и записью неудач в журнал регистрации", "Без обработки ошибок — API всегда доступен", "Только из клиентского кода"]
    answer: 1
    explain: Сеть ненадёжна. Промежуточные неудачи — уровень «Предупреждение», последняя — «Ошибка» с пробросом исключения.
    kb: general/integracii

  - q: Внешний сервис ответил кодом 500. Что это обычно значит?
    options: ["Запрос выполнен успешно", "Ошибка на стороне сервера — запрос можно повторить позже", "Неверная авторизация", "Ресурс не найден"]
    answer: 1
    explain: Коды 2xx — успех, 4xx — ошибка запроса клиента (400 — неверные данные, 401/403 — авторизация и права, 404 — не найдено; повтор того же запроса не поможет), 5xx — ошибка сервера (повтор может помочь).
    kb: general/integracii

  - q: Как в 1С прочитать JSON из строки?
    options: ["Через Вычислить()", "`Чтение = Новый ЧтениеJSON; Чтение.УстановитьСтроку(Текст); Данные = ПрочитатьJSON(Чтение);`", "Через ЧтениеXML", "СтрРазделить по запятым"]
    answer: 1
    explain: '`ПрочитатьJSON` по умолчанию возвращает Структуру (если ключи — допустимые идентификаторы); с параметром `ПрочитатьВСоответствие = Истина` — Соответствие. Запись — `ЗаписьJSON` и `ЗаписатьJSON`.'
    kb: general/integracii

  - q: Для чего нужен план обмена?
    options: ["Для печати документов", "Описывает узлы обмена и состав данных; платформа регистрирует изменения объектов для каждого узла, чтобы передавать только изменённое", "Для хранения настроек пользователя", "Это вид регистра сведений"]
    answer: 1
    explain: При записи объекта, входящего в состав плана обмена, платформа регистрирует изменение для узлов. После успешной передачи регистрацию снимают.
    kb: general/integracii

  - q: Что такое РИБ?
    options: ["Регистр итогов базы", "Распределённая информационная база — узлы с одинаковой конфигурацией; изменения данных и конфигурации передаются от главного узла к подчинённым", "Расширение интерфейса", "Резервная копия базы"]
    answer: 1
    explain: Для РИБ у плана обмена ставят флаг «Распределённая информационная база». Обмен между разными конфигурациями делают через конвертацию данных и универсальный формат.

  - q: Через какой модуль БСП запускают синхронизацию данных из прикладного кода?
    options: ["ОбщегоНазначения", "`ОбменДаннымиСервер` (универсальный формат — `ОбменДаннымиXDTOСервер`)", "РегламентныеЗаданияСервер", "УправлениеДоступом"]
    answer: 1
    explain: Обмен данными — самая крупная подсистема БСП. Прикладной код обращается к её программному интерфейсу, а не к внутренностям механизма.
