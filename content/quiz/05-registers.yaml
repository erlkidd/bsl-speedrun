topic: Регистры и проведение
questions:
  - q: Какой регистр подходит для учёта остатков товаров на складах?
    options: ["Регистр сведений", "Регистр накопления вида «Остатки»", "Регистр накопления вида «Обороты»", "Регистр расчёта"]
    answer: 1
    explain: Остатки хранят приход/расход и позволяют получить остаток на дату (`.Остатки`, `.ОстаткиИОбороты`). «Обороты» — для показателей, у которых нет смысла остатка (продажи, выручка).
    kb: general/registry

  - q: Может ли в регистре сведений быть запись без регистратора?
    options: ["Нет, никогда", "Да, если регистр независимый (режим записи «Независимый»)", "Только в периодическом регистре", "Только через расширение"]
    answer: 1
    explain: Независимый регистр сведений пишется напрямую через менеджер записи или набор. В режиме «Подчинение регистратору» записи создаёт документ при проведении.

  - q: Что делает платформа с движениями документа при отмене проведения?
    options: ["Оставляет как есть", "Удаляет все движения по регистрам, у которых документ — регистратор", "Создаёт сторнирующие движения", "Удаляет сам документ"]
    answer: 1
    explain: При отмене проведения (и при перепроведении) наборы записей регистров, где документ является регистратором, очищаются. Сторно — это прикладная логика, сама платформа его не делает.

  - q: Сколько основных таблиц в СУБД у регистра накопления остатков с включёнными итогами?
    options: ["Одна", "Две: таблица движений и таблица итогов", "По таблице на каждое измерение", "Четыре"]
    answer: 1
    explain: Движения хранятся в основной таблице, остатки — в таблице итогов по периодам. Поэтому остаток на дату платформа получает быстро, без суммирования всех движений с начала времён.

  - q: Что даёт «разделение итогов» у регистра накопления?
    options: ["Итоги считаются по каждому пользователю", "Параллельные записи меньше блокируют друг друга: итоги пишутся в разные строки-разделители", "Регистр разделяется на два", "Отключает итоги"]
    answer: 1
    explain: Без разделения все транзакции, пишущие одинаковые измерения, конкурируют за одну строку итогов. Разделитель позволяет писать параллельно, итоги суммируются при чтении.

  - q: Зачем при проведении сначала ставят управляемую блокировку, а потом читают остатки?
    options: ["Так требует синтаксис", "Чтобы между чтением остатка и записью движений другая транзакция не списала тот же остаток", "Чтобы ускорить запрос", "Чтобы документ нельзя было открыть"]
    answer: 1
    explain: Классическая схема контроля остатков — заблокировать нужные остатки (`БлокировкаДанных`, режим «Исключительный»), прочитать, проверить, записать. Иначе две параллельные продажи увидят один и тот же остаток.

  - q: Чем вытесняющие виды расчёта отличаются от ведущих?
    options: ["Это одно и то же", "Вытесняющие не могут действовать одновременно в одном периоде (отпуск вытесняет оклад); ведущие — те, от результата которых зависит расчёт другого вида", "Ведущие считаются первыми по алфавиту", "Вытесняющие удаляют записи регистра"]
    answer: 1
    explain: Вытеснение — по периоду действия (больничный вытесняет оклад на свои дни). Ведущие виды задают зависимость пересчёта (изменился оклад → пересчитать премию).
