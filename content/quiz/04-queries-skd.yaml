topic: Запросы и СКД
questions:
- q: Чем `ОБЪЕДИНИТЬ` отличается от `ОБЪЕДИНИТЬ ВСЕ`?
  options:
  - Ничем
  - '`ОБЪЕДИНИТЬ` убирает одинаковые строки (как РАЗЛИЧНЫЕ), `ОБЪЕДИНИТЬ ВСЕ` оставляет все строки и работает быстрее'
  - '`ОБЪЕДИНИТЬ ВСЕ` объединяет только первые таблицы'
  - '`ОБЪЕДИНИТЬ` соединяет таблицы по ключу'
  answer: 1
  explain: '`ОБЪЕДИНИТЬ` дополнительно схлопывает дубликаты — СУБД приходится их искать. Если дублей быть не может или они нужны, пишут `ОБЪЕДИНИТЬ ВСЕ`.'
- q: Чем временная таблица обычно лучше вложенного запроса в соединении?
  options:
  - Временная таблица хранится в базе навсегда
  - Оптимизатор СУБД знает размер и может использовать индекс временной таблицы; вложенный запрос в соединении часто приводит к неудачному плану
  - Вложенные запросы запрещены в 1С
  - Временная таблица выполняется на клиенте
  answer: 1
  explain: Вложенный запрос в соединении СУБД не всегда может правильно оценить, отсюда неудачные планы (вложенные циклы). Результат во временной таблице материализован, по нему можно построить индекс (`ИНДЕКСИРОВАТЬ ПО`).
- q: Что делает `ВЫРАЗИТЬ(Поле КАК Справочник.Номенклатура)` для поля составного типа?
  options:
  - Преобразует строку в ссылку
  - Приводит поле к одному типу — платформа не делает соединения со всеми таблицами составного типа при обращении «через точку»
  - Создаёт новый элемент справочника
  - Фильтрует только элементы справочника
  answer: 1
  explain: При обращении через точку от составного поля (например, Регистратор) платформа соединяет все возможные таблицы. `ВЫРАЗИТЬ` сужает тип до одного — запрос становится легче.
- q: Что такое `ЕСТЬNULL(Поле, 0)`?
  options:
  - Проверка, что поле пустое
  - Возвращает 0, если поле равно NULL (например, после левого соединения), иначе само поле
  - Условие ГДЕ Поле ЕСТЬ NULL
  - Функция только для СКД
  answer: 1
  explain: После `ЛЕВОГО СОЕДИНЕНИЯ` поля правой таблицы могут быть NULL. Арифметика с NULL даёт NULL, поэтому их оборачивают в `ЕСТЬNULL`.
- q: Где выполняется условие, указанное в разделе `ИМЕЮЩИЕ`?
  options:
  - До группировки, как ГДЕ
  - После группировки — по агрегированным значениям
  - Только в СКД
  - На клиенте
  answer: 1
  explain: '`ГДЕ` фильтрует исходные строки до группировки, `ИМЕЮЩИЕ` — уже сгруппированный результат, например `ИМЕЮЩИЕ СУММА(Сумма) > 1000`.'
- q: Чем схема компоновки данных отличается от системы компоновки данных?
  options:
  - Это синонимы
  - Система (СКД) — механизм платформы; схема — описание конкретного отчёта (наборы данных, поля, ресурсы, параметры, варианты)
  - Схема работает только с запросами, система — с объектами
  - Схема — устаревшее название
  answer: 1
  explain: Система компоновки данных — весь механизм (компоновщик макета, процессор компоновки, вывод). Схема компоновки данных — один объект-описание, по которому этот механизм строит отчёт.
- q: Какой набор данных СКД позволяет вывести в отчёт готовую `ТаблицуЗначений`?
  options:
  - Набор данных «Запрос»
  - Набор данных «Объект» — данные передаются через внешние наборы данных при программном выводе
  - Набор данных «Объединение»
  - Никакой, только через макет
  answer: 1
  explain: Для набора «Объект» указывается имя, а при программной компоновке передаётся структура `ВнешниеНаборыДанных` с таблицей значений под этим именем.
- q: Что делает `ВЫРАЗИТЬ(Сумма / Курс КАК Число(15, 2))`?
  options:
  - Меняет тип колонки на строку
  - Приводит результат к числу с 2 знаками после запятой (округляет)
  - Проверяет тип
  - Ничего
  answer: 1
  explain: ВЫРАЗИТЬ применяют и к примитивным типам — задать точность числа или длину строки.
- q: Что вернёт `РАЗНОСТЬДАТ(&Нач, &Кон, ДЕНЬ)`?
  options:
  - Дату
  - Число календарных дней между датами
  - Строку
  - Количество секунд
  answer: 1
  explain: 'Третий параметр — единица: СЕКУНДА, МИНУТА, ЧАС, ДЕНЬ, МЕСЯЦ, КВАРТАЛ, ГОД.'
- q: Как получить начало месяца даты в запросе?
  options:
  - '`НачалоМесяца(Дата)`'
  - '`НАЧАЛОПЕРИОДА(Дата, МЕСЯЦ)`'
  - '`МЕСЯЦ(Дата)`'
  - '`Дата - ДЕНЬ(Дата)`'
  answer: 1
  explain: 'В языке запросов свои функции дат: НАЧАЛОПЕРИОДА, КОНЕЦПЕРИОДА, ДОБАВИТЬКДАТЕ, РАЗНОСТЬДАТ.'
