topic: Расширения, подписки, RLS
questions:
  - q: Какая аннотация в расширении выполняет свой код вместо типового метода, но позволяет вызвать типовой через `ПродолжитьВызов()`?
    options: ["&Перед", "&После", "&Вместо", "&ИзменениеИКонтроль"]
    answer: 2
    explain: '`&Вместо` заменяет метод; внутри можно вызвать исходный через `ПродолжитьВызов(...)`. `&Перед` и `&После` добавляют код до/после типового. `&ИзменениеИКонтроль` — правка текста метода с контролем изменений при обновлении.'

  - q: Чем подписка на событие лучше правки модуля объекта в типовой конфигурации?
    options: ["Подписка работает быстрее", "Код живёт в общем модуле и не меняет модуль объекта — меньше конфликтов при обновлении; одна подписка может обслуживать много объектов", "Подписка выполняется на клиенте", "Подписки не попадают в транзакцию"]
    answer: 1
    explain: Источником подписки можно указать много типов. Минус — порядок выполнения подписок не гарантирован, а неаккуратная подписка на частые события замедляет запись всех объектов-источников.

  - q: Что делает слово `РАЗРЕШЕННЫЕ` в запросе?
    options: ["Отключает RLS", "Записи, недоступные по RLS, молча исключаются из результата вместо ошибки «Недостаточно прав»", "Выбирает только проведённые документы", "Разрешает изменение данных"]
    answer: 1
    explain: Без `РАЗРЕШЕННЫЕ` при наличии ограничения доступа на чтение и записей, которые нельзя читать, запрос завершится ошибкой. В запросах для пользователей с ограничениями ставят `ВЫБРАТЬ РАЗРЕШЕННЫЕ`.

  - q: Почему RLS не стоит считать единственной защитой данных?
    options: ["RLS не работает в клиент-серверном варианте", "Привилегированный режим, `УстановитьПривилегированныйРежим(Истина)` и права на прямой доступ к СУБД обходят RLS; ограничения надо проверять и в бизнес-логике", "RLS работает только для администраторов", "RLS отключается после обновления"]
    answer: 1
    explain: Ограничения доступа применяются к запросам и объектам пользователя, но код в привилегированном режиме и доступ на уровне СУБД их не учитывают. Защита строится слоями.

  - q: Что значит «заимствовать» объект в расширение?
    options: ["Скопировать объект в расширение с отключением исходного", "Добавить в расширение ссылку на объект основной конфигурации, чтобы расширять его: добавлять реквизиты, формы, перехватывать методы модулей", "Выгрузить объект в файл", "Удалить объект из основной конфигурации"]
    answer: 1
    explain: Заимствованный объект остаётся объектом основной конфигурации. Расширение лишь дополняет его — свои реквизиты, формы, методы с аннотациями `&Перед`, `&После`, `&Вместо`. При обновлении типовой платформа проверяет, что заимствованные свойства не разошлись.
