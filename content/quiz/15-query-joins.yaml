topic: 'Запросы: соединения и объединения'
questions:
- q: Таблица А — 4 строки, таблица Б — 3 строки. Сколько строк вернёт `ВЫБРАТЬ * ИЗ А, Б`?
  options:
  - '7'
  - '12'
  - '4'
  - '3'
  answer: 1
  explain: 'Таблицы через запятую без условия дают декартово произведение: каждая строка А с каждой строкой Б.'
  kb: queries/zapros-soedineniya
- q: Чем `ЛЕВОЕ СОЕДИНЕНИЕ` отличается от `ВНУТРЕННЕГО`?
  options:
  - Левое быстрее
  - Левое оставляет все строки левой таблицы; если пары нет, поля правой заполняются NULL
  - Левое убирает дубли
  - Ничем, это синонимы
  answer: 1
  explain: Внутреннее оставляет только строки, для которых нашлась пара. Левое сохраняет всю левую таблицу.
  kb: queries/zapros-soedineniya
- q: Левое соединение `Товары` → `Цены`, затем `ГДЕ Цены.ВидЦены = &Вид`. Что станет с товарами без цены?
  options:
  - Останутся с NULL
  - 'Пропадут из результата: условие в ГДЕ по полю правой таблицы отбрасывает строки с NULL'
  - Получат цену 0
  - Запрос упадёт
  answer: 1
  explain: NULL = значение — не истина. Левое соединение фактически превращается во внутреннее. Условие на правую таблицу пишут в `ПО` или в параметрах виртуальной таблицы.
  kb: queries/zapros-soedineniya
- q: У товара две записи в присоединяемой таблице штрихкодов. Сколько строк по этому товару будет после левого соединения?
  options:
  - Одна
  - Две — строка левой таблицы повторится для каждой найденной пары
  - Ноль
  - Зависит от сортировки
  answer: 1
  explain: Соединение размножает строки левой таблицы по числу совпадений справа. Отсюда «неожиданно удвоившиеся» суммы.
  kb: queries/zapros-soedineniya
- q: Чем `ОБЪЕДИНИТЬ ВСЕ` отличается от соединения?
  options:
  - Ничем
  - Объединение ставит результаты запросов друг под другом (строки), соединение приставляет колонки одной таблицы к строкам другой
  - Объединение работает только с временными таблицами
  - Соединение медленнее всегда
  answer: 1
  explain: ОБЪЕДИНИТЬ — «по вертикали», число полей в запросах должно совпадать. СОЕДИНЕНИЕ — «по горизонтали», по условию ПО.
  kb: queries/zapros-soedineniya
- q: Откуда берутся имена колонок результата при `ОБЪЕДИНИТЬ`?
  options:
  - Из последнего запроса
  - Из первого запроса
  - Объединяются через подчёркивание
  - Задаются отдельно после УПОРЯДОЧИТЬ
  answer: 1
  explain: Псевдонимы задаёт первый запрос объединения; во втором и следующих имена полей роли не играют — важен порядок.
  kb: queries/zapros-soedineniya
- q: Зачем после левого соединения оборачивать числовое поле правой таблицы в `ЕСТЬNULL(Поле, 0)`?
  options:
  - Для красоты
  - 'Арифметика и сравнения с NULL дают NULL: без замены итог строки будет пустым, а условие — ложным'
  - Чтобы ускорить запрос
  - Так требует синтаксис
  answer: 1
  explain: '`100 + NULL = NULL`. Агрегаты NULL пропускают, но выражения внутри строки — нет.'
  kb: queries/zapros-soedineniya
- q: Когда уместно `ПОЛНОЕ СОЕДИНЕНИЕ`?
  options:
  - Никогда
  - Когда нужны строки обеих таблиц, даже если пары нет ни слева, ни справа — например, план и факт
  - Вместо ОБЪЕДИНИТЬ ВСЕ
  - Только для регистров
  answer: 1
  explain: 'Полное соединение = левое + правое: непарные строки с обеих сторон остаются, недостающая половина — NULL.'
  kb: queries/zapros-soedineniya
- q: Нужно найти контрагентов без единого документа. Какой приём корректен?
  options:
  - '`ВНУТРЕННЕЕ СОЕДИНЕНИЕ … ГДЕ Док.Ссылка = NULL`'
  - '`ЛЕВОЕ СОЕДИНЕНИЕ … ГДЕ Док.Ссылка ЕСТЬ NULL` либо `НЕ Ссылка В (ВЫБРАТЬ Контрагент ИЗ …)`'
  - '`ПРАВОЕ СОЕДИНЕНИЕ` без условий'
  - '`ВЫБРАТЬ РАЗЛИЧНЫЕ` по документам'
  answer: 1
  explain: '«Антисоединение»: левое соединение и отбор строк, которым пара не нашлась. Вариант с `НЕ В (подзапрос)` даёт тот же результат.'
  kb: queries/zapros-soedineniya
- q: Почему соединение с вложенным запросом считается плохой практикой?
  options:
  - Оно запрещено синтаксисом
  - Оптимизатор СУБД плохо оценивает размер вложенного запроса и может выбрать медленный план; надёжнее временная таблица
  - Вложенные запросы не поддерживают ГДЕ
  - Потому что нельзя задать псевдоним
  answer: 1
  explain: 'Стандарт: материализовать вложенный запрос во временную таблицу (`ПОМЕСТИТЬ`), при необходимости с `ИНДЕКСИРОВАТЬ ПО`.'
  kb: queries/zapros-vremennye-tablicy
- q: Что такое `ПО ИСТИНА` в соединении?
  options:
  - Ошибка
  - 'Условие, истинное для любой пары строк: так присоединяют таблицу из одной строки (итог, курс) ко всем строкам'
  - Соединение по булевым полям
  - Признак левого соединения
  answer: 1
  explain: Если справа ровно одна строка, `ПО ИСТИНА` просто «приклеивает» её поля к каждой строке слева.
  kb: queries/zapros-soedineniya
