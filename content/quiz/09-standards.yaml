topic: Стандарты кодирования
questions:
  - q: Почему `Строка = Строка + Элемент` в цикле — плохая практика?
    options: ["Так нельзя по синтаксису", "Строки неизменяемы: каждая итерация копирует всё накопленное — время и память растут квадратично. Нужно собрать части в массив и `СтрСоединить()`", "Плюс работает только с числами", "Это медленнее только на клиенте"]
    answer: 1
    explain: Стандарт ИТС «Эффективная работа со строками». Для фиксированного числа подстановок — `СтрШаблон()`, для произвольного количества частей — массив и `СтрСоединить(Части, Разделитель)`.
    kb: general/standarty

  - q: Зачем оборачивать строки, которые видит пользователь, в `НСтр()`?
    options: ["Чтобы строка выводилась жирным", "Чтобы её можно было локализовать — перевести на другие языки интерфейса", "Чтобы ускорить вывод", "Это нужно только для сообщений об ошибках"]
    answer: 1
    explain: '`НСтр("ru = ''Текст''")` хранит варианты для разных языков. Без него строку не перевести. Для подстановки значений — `СтрШаблон(НСтр(...), Параметр1, ...)`.'
    kb: general/standarty

  - q: Чем опасны `Выполнить()` и `Вычислить()`?
    options: ["Ничем, это обычные функции", "Это аналог eval: угроза безопасности, код невидим для статического анализа и сложно отлаживается", "Они работают только в файловой базе", "Они удалены из платформы"]
    answer: 1
    explain: Стандарт рекомендует обходиться без них. Например, менеджер объекта по ссылке даёт `ОбщегоНазначения.МенеджерОбъектаПоСсылке(Ссылка)` из БСП — без сборки кода строкой.

  - q: Как стандарт ИТС рекомендует называть булеву переменную?
    options: ["Флаг1, Флаг2", "В утвердительной форме: ЭтоНовый, ЕстьОшибки, РазрешеноРедактирование", "С отрицанием: НеЗаполнено", "Латиницей: isNew"]
    answer: 1
    explain: Имена — на русском, в ВерблюжьемРегистре. Процедура — глагольная фраза (`ЗаполнитьТабличнуюЧасть`), функция — существительное или вопрос (`ЭтоНовый`), булево — утверждение.

  - q: Какую область НЕ относят к стандартным областям общего модуля?
    options: ["ПрограммныйИнтерфейс", "СлужебныйПрограммныйИнтерфейс", "СлужебныеПроцедурыИФункции", "ГлобальныеПеременные"]
    answer: 3
    explain: Порядок областей общего модуля — `ПрограммныйИнтерфейс` (публичный API), `СлужебныйПрограммныйИнтерфейс` (для своей подсистемы), `СлужебныеПроцедурыИФункции` (внутренняя реализация). В общих модулях переменных модуля нет вообще.
    kb: general/standarty

  - q: Почему нельзя назвать локальную переменную `Документы`?
    options: ["Слишком длинное имя", "Она затенит глобальную коллекцию менеджеров — дальнейшие обращения к `Документы.…` в этом коде сломаются", "Кириллица запрещена", "Можно, это нормально"]
    answer: 1
    explain: Имена глобального контекста (`Документы`, `Справочники`, `РегистрыСведений`, `Константы`, `ПараметрыСеанса` и т.д.) не используют для переменных.

  - q: Что не так с кодом `Для Каждого Стр Из Документ.Товары Цикл Вид = Стр.Номенклатура.ВидНоменклатуры; КонецЦикла;`?
    options: ["Ничего", "Каждое обращение через точку к реквизиту ссылки — отдельное чтение из базы (N+1). Нужно получить данные одним запросом", "Нельзя обходить табличную часть циклом", "Нужно писать Для Каждого с индексом"]
    answer: 1
    explain: Обращение через точку от ссылки неявно читает объект. В цикле это N обращений к базе. Данные берут одним запросом или через `ОбщегоНазначения.ЗначениеРеквизитаОбъектов`.

  - q: Где по стандарту должна жить бизнес-логика записи и проверок документа?
    options: ["В модуле формы", "В модуле объекта (и общих модулях) — её можно переиспользовать и тестировать, она срабатывает при записи из любого места", "В модуле приложения", "В макете"]
    answer: 1
    explain: Код в форме сработает только при работе через эту форму. Записать документ можно и обработкой, и обменом — проверки в `ПередЗаписью`/`ОбработкаПроверкиЗаполнения` модуля объекта сработают всегда.

  - q: Чем открывать формы в управляемом приложении?
    options: ["ПолучитьФорму() и Открыть()", "ОткрытьФорму() с ОписаниеОповещения для результата", "ОткрытьФормуМодально()", "Формы открываются только из командного интерфейса"]
    answer: 1
    explain: '`ПолучитьФорму()` — механизм обычного приложения. Модальное открытие не работает в веб-клиенте и при отключённой модальности; результат получают через `ОписаниеОповещения`.'
