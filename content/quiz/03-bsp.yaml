topic: БСП (Библиотека стандартных подсистем)
questions:
  - q: Как правильно показать пользователю сообщение с привязкой к полю формы средствами БСП?
    options: ["Сообщить(Текст)", "ОбщегоНазначения.СообщитьПользователю(Текст, , Поле)", "Предупреждение(Текст)", "ВызватьИсключение Текст"]
    answer: 1
    explain: '`ОбщегоНазначения.СообщитьПользователю` (и `ОбщегоНазначенияКлиент.СообщитьПользователю`) умеет привязывать сообщение к полю/объекту и правильно работает в фоновых заданиях. Голый `Сообщить()` в типовых не используют.'
    kb: bsp/obshego-naznacheniya

  - q: Каким методом БСП получить значение одного реквизита объекта по ссылке, не загружая весь объект?
    options: ["Ссылка.ПолучитьОбъект().Реквизит", "ОбщегоНазначения.ЗначениеРеквизитаОбъекта(Ссылка, \"Реквизит\")", "Ссылка.Реквизит", "РеквизитыОбъекта(Ссылка)"]
    answer: 1
    explain: '`ЗначениеРеквизитаОбъекта` делает запрос только за нужным полем. `ПолучитьОбъект()` читает весь объект с табличными частями, а «через точку» от ссылки — тоже неявный запрос и плохой стиль в серверном коде. Для нескольких полей — `ЗначенияРеквизитовОбъекта`.'
    kb: bsp/obshego-naznacheniya

  - q: Какая подсистема БСП отвечает за выполнение длительных операций в фоне с ожиданием на клиенте?
    options: ["ЗавершениеРаботыПользователей", "ДлительныеОперации", "РегламентныеЗадания", "ФоновыеЗадания"]
    answer: 1
    explain: Модули `ДлительныеОперации` / `ДлительныеОперацииКлиент` — `ВыполнитьВФоне`, `ВыполнитьФункцию`, `ОжидатьЗавершение`. Это стандартный способ не «вешать» интерфейс тяжёлой серверной операцией.

  - q: Где в БСП принято размещать свои дополнения, чтобы не править код библиотеки?
    options: ["Прямо в модулях БСП", "В модулях `...Переопределяемый` (переопределяемые модули)", "В отдельной базе", "В модуле приложения"]
    answer: 1
    explain: БСП даёт точки расширения через переопределяемые модули (`ОбщегоНазначенияПереопределяемый`, `УправлениеПечатьюПереопределяемый` и т.д.). Свой код пишут туда — так обновление БСП проходит проще.

  - q: Какой модуль БСП используют для подключения своих печатных форм к командам «Печать»?
    options: ["УправлениеПечатью", "ПечатьДокументов", "МакетыПечати", "ТабличныйДокумент"]
    answer: 0
    explain: Подсистема «Печать» — модуль `УправлениеПечатью`. В менеджере объекта реализуют `ДобавитьКомандыПечати` и `Печать`, а подсистема сама выводит команды и формирует печатные формы.
