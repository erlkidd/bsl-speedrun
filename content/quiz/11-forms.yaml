topic: Управляемые формы
questions:
  - q: Функции нужно прочитать данные из базы, но реквизиты формы ей не нужны. Какую директиву выбрать?
    options: ["&НаКлиенте", "&НаСервере", "&НаСервереБезКонтекста", "&НаКлиентеНаСервереБезКонтекста"]
    answer: 2
    explain: '`&НаСервере` передаёт на сервер весь контекст формы туда и обратно. Если он не нужен — `&НаСервереБезКонтекста`, передаются только параметры.'
    kb: general/formy

  - q: Для чего директива `&НаКлиентеНаСервереБезКонтекста`?
    options: ["Для запросов к базе", "Для чистых вычислений без базы и без данных формы — функцию можно вызвать и на клиенте, и на сервере без серверного вызова", "Для фоновых заданий", "Для обработчиков событий формы"]
    answer: 1
    explain: Например, расчёт суммы строки по количеству и цене. Вызов с клиента выполнится на клиенте — без сетевого обмена.
    kb: general/formy

  - q: Пользователь сменил контрагента в документе, нужно заполнить договор, организацию, валюту и курс. Как правильно?
    options: ["Четыре серверных вызова — по одному на поле", "Один серверный вызов, который возвращает Структуру со всеми значениями", "Читать через точку на клиенте", "Открыть форму контрагента"]
    answer: 1
    explain: Каждый серверный вызов — сетевой обмен. Данные собирают за один вызов и раскладывают по полям на клиенте.
    kb: general/formy

  - q: Что будет, если на сервере формы вызвать `РеквизитФормыВЗначение("Объект")`, изменить объект и не вызвать `ЗначениеВРеквизитФормы`?
    options: ["Изменения сохранятся в базе", "Изменения потеряются — форма их не увидит", "Ошибка компиляции", "Объект запишется автоматически"]
    answer: 1
    explain: '`РеквизитФормыВЗначение` даёт копию — настоящий объект, у которого можно вызвать методы модуля объекта. Чтобы изменения попали в форму, нужно `ЗначениеВРеквизитФормы(ДокументОбъект, "Объект")`.'

  - q: В каком порядке вызываются события при записи объекта из формы?
    options: ["ПослеЗаписи → ПередЗаписью", "ПередЗаписью (клиент) → ПередЗаписьюНаСервере → ПриЗаписиНаСервере → ПослеЗаписиНаСервере → ПослеЗаписи (клиент)", "ПриЗаписиНаСервере → ПередЗаписью", "Порядок не определён"]
    answer: 1
    explain: '`ПриЗаписиНаСервере` выполняется в той же транзакции, что и запись. Оповещение других форм обычно делают в клиентском `ПослеЗаписи`.'

  - q: Почему вместо `Вопрос()` и `Предупреждение()` используют `ПоказатьВопрос()` и `ПоказатьПредупреждение()`?
    options: ["Они красивее", "Модальные методы не работают в веб-клиенте и при отключённом режиме модальности; асинхронные получают ответ через ОписаниеОповещения", "Старые методы удалены", "Новые быстрее работают на сервере"]
    answer: 1
    explain: Обработчик ответа — экспортная процедура формы, указанная в `Новый ОписаниеОповещения("ИмяПроцедуры", ЭтотОбъект)`.

  - q: Как форма списка узнаёт, что документ записали в другой форме?
    options: ["Никак, нужно обновлять вручную", "Форма документа вызывает `Оповестить(ИмяСобытия, Параметр, Источник)`, а форма списка ловит его в `ОбработкаОповещения`", "Через регламентное задание", "Через параметры сеанса"]
    answer: 1
    explain: Это механизм оповещений между открытыми формами на клиенте.

  - q: Какой тип нельзя напрямую передать с сервера на клиент?
    options: ["Структура", "Массив", "ТаблицаЗначений", "Ссылка"]
    answer: 2
    explain: '`ТаблицаЗначений`, `ДеревоЗначений`, `Запрос`, `РезультатЗапроса` — только серверные. На форме таблицу хранят в реквизите формы (ДанныеФормыКоллекция), а для передачи используют массивы и структуры.'

  - q: Как правильно задать отбор динамического списка из кода, чтобы пользователь мог его менять?
    options: ["Дописать условие в ГДЕ текста запроса", "Через отбор компоновки данных — например `ОбщегоНазначенияКлиентСервер.УстановитьЭлементОтбораДинамическогоСписка`", "Отфильтровать на клиенте", "Создать новый список"]
    answer: 1
    explain: Динамический список сам делает постраничную загрузку, сортировку и поиск. Отборы задают через компоновку данных, а не правкой текста запроса.
