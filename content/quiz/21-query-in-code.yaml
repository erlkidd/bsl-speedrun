topic: Запросы в коде BSL
questions:
- q: Как передать значение отбора в запрос?
  options:
  - 'Склеить строкой: `"ГДЕ Код = " + Код`'
  - '`Запрос.УстановитьПараметр("Код", Код)` и `&Код` в тексте'
  - Через глобальную переменную
  - Через `Формат()`
  answer: 1
  explain: Параметры исключают ошибки форматирования и подмену текста запроса, а СУБД может повторно использовать план.
  kb: queries/zapros-v-kode
- q: Чем `Результат.Выбрать()` отличается от `Результат.Выгрузить()`?
  options:
  - Ничем
  - Выбрать — последовательный обход выборкой; Выгрузить — вся таблица значений сразу в памяти
  - Выгрузить работает только на клиенте
  - Выбрать возвращает массив
  answer: 1
  explain: Выборка экономит память на больших результатах, выгрузка удобна для поиска и передачи дальше.
  kb: queries/zapros-v-kode
- q: Как проверить, что запрос ничего не вернул, не обходя результат?
  options:
  - '`Результат.Количество() = 0`'
  - '`Результат.Пустой()`'
  - '`Результат = Неопределено`'
  - '`Выборка.Следующий() = Ложь` — единственный способ'
  answer: 1
  explain: '`РезультатЗапроса.Пустой()` — самый дешёвый способ.'
  kb: queries/zapros-v-kode
- q: Почему запрос в цикле — плохо?
  options:
  - Синтаксически запрещён
  - 'Каждый запрос — отдельное обращение к СУБД: 1000 итераций дают 1000 обращений вместо одного запроса с параметром-массивом или временной таблицей'
  - Запросы нельзя вызывать повторно
  - Нагружает только клиент
  answer: 1
  explain: 'Стандарт: получить данные одним запросом, а в цикле работать с соответствием или таблицей значений.'
  kb: queries/zapros-v-kode
- q: Что возвращает `Запрос.ВыполнитьПакет()`?
  options:
  - Результат последнего запроса
  - Массив результатов — по одному на каждый запрос пакета
  - Таблицу значений
  - Число запросов
  answer: 1
  explain: '`Выполнить()` отдаёт только результат последнего запроса пакета; `ВыполнитьПакет()` — все.'
  kb: queries/zapros-v-kode
- q: Для чего нужен `МенеджерВременныхТаблиц`?
  options:
  - Для ускорения любых запросов
  - Чтобы временные таблицы жили между несколькими запросами и ими можно было управлять явно
  - Для блокировок
  - Для транзакций
  answer: 1
  explain: Один менеджер назначают нескольким объектам Запрос — они видят общие временные таблицы.
  kb: queries/zapros-v-kode
- q: Как передать в условие `В (&Список)` несколько значений?
  options:
  - Строкой через запятую
  - Параметром-массивом, списком значений или таблицей значений
  - Никак
  - Только по одному через ИЛИ
  answer: 1
  explain: '`Запрос.УстановитьПараметр("Список", МассивСсылок)`.'
  kb: queries/zapros-v-kode
- q: Где допустимо выполнять запрос к базе данных?
  options:
  - В любом месте
  - 'Только на сервере: в серверных процедурах и модулях'
  - Только на клиенте
  - Только в модуле формы
  answer: 1
  explain: Объект Запрос недоступен на тонком и веб-клиенте — нужен серверный вызов.
  kb: general/klient-server
- q: Зачем в тексте запроса писать `РАЗРЕШЕННЫЕ`?
  options:
  - Ускоряет запрос
  - При ограничениях доступа на уровне записей вернутся только доступные пользователю строки, а не ошибка нарушения прав
  - Разрешает менять данные
  - Снимает все ограничения
  answer: 1
  explain: Без РАЗРЕШЕННЫЕ запрос, задевший недоступные записи, завершится ошибкой.
  kb: general/rls
- q: Как обойти результат запроса с разделом ИТОГИ по уровням группировок?
  options:
  - Обычным `Выбрать()`
  - '`Результат.Выбрать(ОбходРезультатаЗапроса.ПоГруппировкам)` и вложенные выборки'
  - Только `Выгрузить()`
  - Никак
  answer: 1
  explain: Каждая выборка уровня отдаёт дочернюю через `Выборка.Выбрать()`.
  kb: queries/zapros-v-kode
- q: Нужно получить реквизиты 500 ссылок. Как правильно?
  options:
  - 500 раз обратиться `Ссылка.Реквизит`
  - Одним запросом с `ГДЕ Ссылка В (&Ссылки)`, либо функцией БСП `ЗначенияРеквизитовОбъектов`
  - 500 запросов в цикле
  - '`ПолучитьОбъект()` для каждой'
  answer: 1
  explain: Обращение к реквизиту через точку от ссылки читает из базы объект целиком — и так 500 раз.
  kb: bsp/obshego-naznacheniya
