topic: Обработка ошибок и транзакции (углублённо)
questions:
  - q: Где должен стоять `НачатьТранзакцию()` относительно `Попытка`?
    options: ["Внутри Попытка первой строкой", "Непосредственно перед `Попытка`, без кода между ними", "Где угодно до Попытка", "После ЗафиксироватьТранзакцию"]
    answer: 1
    explain: Если между `НачатьТранзакцию()` и `Попытка` случится ошибка, транзакцию никто не отменит, и она «повиснет». Поэтому стандарт требует ставить их вплотную.
    kb: general/tranzakcii

  - q: Какой оператор должен быть первым в блоке `Исключение` при ручной транзакции?
    options: ["ЗаписьЖурналаРегистрации", "ОтменитьТранзакцию()", "Сообщить", "ВызватьИсключение"]
    answer: 1
    explain: Сначала откат, потом логирование и проброс. Логирование тоже может упасть — если откат ещё не сделан, транзакция останется открытой.
    kb: general/tranzakcii

  - q: Что произойдёт, если вложенный код вызвал `ОтменитьТранзакцию()`, а внешний затем вызывает `ЗафиксироватьТранзакцию()`?
    options: ["Внешняя транзакция зафиксируется", "Исключение: вложенные транзакции в 1С счётчиковые, отмена на любом уровне помечает всю транзакцию отменённой", "Зафиксируется только внешняя часть", "Ничего"]
    answer: 1
    explain: Вложенный `НачатьТранзакцию()` лишь увеличивает счётчик. Поэтому каждый уровень пишет канонический шаблон и пробрасывает исключение `ВызватьИсключение;`, чтобы внешний код тоже откатился.

  - q: Что не так с кодом `Попытка ... Исключение КонецПопытки;` с пустым блоком исключения?
    options: ["Ничего, ошибка обработана", "Исключение «проглочено»: данные могли не записаться, пользователь не узнает, в журнале регистрации нет следов", "Это синтаксическая ошибка", "Так быстрее работает"]
    answer: 1
    explain: Стандарт — в обработчике исключения обязательно фиксировать информацию в журнале регистрации (`ЗаписьЖурналаРегистрации` с `ПодробноеПредставлениеОшибки`) и, как правило, пробрасывать дальше.

  - q: Какое представление ошибки писать в журнал регистрации, а какое показывать пользователю?
    options: ["Пользователю — подробное, в журнал — краткое", "В журнал — `ПодробноеПредставлениеОшибки` (стек, строки), пользователю — `КраткоеПредставлениеОшибки` и понятный текст", "Одно и то же", "Пользователю ничего не показывать"]
    answer: 1
    explain: Пользователю — что случилось и что делать. Техническая информация со стеком вызовов нужна администратору и разработчику — ей место в журнале.

  - q: Чем `ВызватьИсключение;` отличается от `ВызватьИсключение "Текст";`?
    options: ["Ничем", "Без параметра — проброс исходной ошибки с сохранением стека (для промежуточного кода); с текстом — новая ошибка с понятным сообщением (на границе с пользователем)", "Текст обязателен всегда", "Без параметра программа завершается"]
    answer: 1
    explain: В модулях объектов и общих модулях ошибку пробрасывают как есть. На уровне формы можно заменить технический текст понятным пользователю.

  - q: Почему HTTP-запрос к внешнему сервису нельзя делать внутри транзакции?
    options: ["HTTP запрещён в транзакциях синтаксисом", "Пока ждём ответа (таймаут может быть 30 секунд), транзакция держит блокировки — другие пользователи ждут", "Ответ не придёт", "Так требует лицензия"]
    answer: 1
    explain: Внешние вызовы делают вне транзакции, в `Попытка ... Исключение`, с повторными попытками. Промежуточные неудачи пишут в журнал как предупреждение, последнюю — как ошибку.

  - q: Как при массовой обработке документов поступить с ошибкой одного документа?
    options: ["Остановить обработку всех", "Транзакция на каждый элемент; ошибку записать в журнал и в список ошибок, продолжить остальные, в конце показать список", "Игнорировать молча", "Отменить все уже обработанные"]
    answer: 1
    explain: Одна большая транзакция на всю пачку держит блокировки долго и откатывает всё из-за одной ошибки. Поэлементная обработка с накоплением ошибок — стандартный подход.

  - q: Для чего `ЗаблокироватьДанныеДляРедактирования(Ссылка)`?
    options: ["Для управляемой блокировки остатков", "Пессимистическая блокировка объекта: второй пользователь получит «Объект заблокирован», а не потерянное обновление", "Чтобы запретить удаление", "Для блокировки формы на клиенте"]
    answer: 1
    explain: '`БлокировкаДанных` — управляемая блокировка записей в транзакции (контроль остатков). `ЗаблокироватьДанныеДляРедактирования` защищает объект целиком от одновременного редактирования.'
