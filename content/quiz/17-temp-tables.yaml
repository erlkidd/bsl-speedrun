topic: 'Запросы: временные таблицы и пакеты'
questions:
- q: Где в запросе пишется `ПОМЕСТИТЬ ИмяТаблицы`?
  options:
  - В самом конце запроса
  - После списка полей, перед ИЗ
  - Перед ВЫБРАТЬ
  - После ГДЕ
  answer: 1
  explain: '`ВЫБРАТЬ поля ПОМЕСТИТЬ втИмя ИЗ …`.'
  kb: queries/zapros-vremennye-tablicy
- q: Что возвращает наружу запрос с `ПОМЕСТИТЬ`?
  options:
  - Строки временной таблицы
  - Только служебную строку с количеством помещённых записей; сами данные лежат во временной таблице
  - Ничего и не выполняется
  - Ссылку на таблицу
  answer: 1
  explain: Данные читает следующий запрос пакета — по имени временной таблицы.
  kb: queries/zapros-vremennye-tablicy
- q: Чем разделяются запросы в пакете?
  options:
  - Запятой
  - Точкой с запятой
  - Словом ДАЛЕЕ
  - Пустой строкой
  answer: 1
  explain: Запросы пакета разделяет `;`. Выполняются по порядку, каждый видит временные таблицы предыдущих.
  kb: queries/zapros-vremennye-tablicy
- q: Как долго живёт временная таблица, созданная в пакете без менеджера временных таблиц?
  options:
  - До перезапуска сервера
  - До конца выполнения этого пакета запросов
  - До конца сеанса
  - Навсегда
  answer: 1
  explain: Без `МенеджерВременныхТаблиц` таблица существует только внутри пакета. С менеджером — пока жив менеджер или пока её не уничтожат.
  kb: queries/zapros-vremennye-tablicy
- q: Зачем нужен `ИНДЕКСИРОВАТЬ ПО` после запроса с `ПОМЕСТИТЬ`?
  options:
  - Сортирует результат
  - Строит индекс временной таблицы по полям, по которым она дальше соединяется или участвует в `В (…)`
  - Нумерует строки
  - Обязателен всегда
  answer: 1
  explain: Индекс оправдан для больших временных таблиц (ориентир — от тысячи строк), используемых в соединениях.
  kb: queries/zapros-vremennye-tablicy
- q: Что делает `УНИЧТОЖИТЬ втТовары`?
  options:
  - Удаляет справочник
  - Удаляет временную таблицу; следующие запросы пакета её уже не увидят
  - Очищает параметры
  - Откатывает транзакцию
  answer: 1
  explain: Отдельный запрос пакета. Освобождает ресурсы и позволяет снова создать таблицу с тем же именем.
  kb: queries/zapros-vremennye-tablicy
- q: Во втором запросе пакета написано `ИЗ втЦены`, но в первом забыли `ПОМЕСТИТЬ втЦены`. Что будет?
  options:
  - Вернётся пустой результат
  - 'Ошибка: таблица не найдена'
  - Платформа создаст таблицу сама
  - Вернётся результат первого запроса
  answer: 1
  explain: Без ПОМЕСТИТЬ первый запрос просто возвращает строки и нигде их не сохраняет.
  kb: queries/zapros-vremennye-tablicy
- q: Как отобрать остатки только по товарам из временной таблицы?
  options:
  - '`ГДЕ Номенклатура = втТовары`'
  - 'В параметрах виртуальной таблицы: `Остатки(, Номенклатура В (ВЫБРАТЬ Товар ИЗ втТовары))`'
  - Только через цикл в коде
  - '`СОЕДИНЕНИЕ` без условия'
  answer: 1
  explain: Подзапрос к временной таблице допустим прямо в параметре-условии виртуальной таблицы — отбор применится до расчёта остатков.
  kb: queries/zapros-vremennye-tablicy
- q: Можно ли передать в запрос готовую `ТаблицаЗначений`?
  options:
  - Нет
  - 'Да: параметром, из которого первым запросом пакета делают временную таблицу — `ВЫБРАТЬ … ПОМЕСТИТЬ вт ИЗ &Таблица КАК Т`'
  - Только через файл
  - Только на клиенте
  answer: 1
  explain: Колонки таблицы значений должны быть типизированы. Так заменяют запрос в цикле одним пакетным запросом.
  kb: queries/zapros-vremennye-tablicy
- q: Главная польза временных таблиц с точки зрения читаемости?
  options:
  - Запрос становится короче
  - Сложная выборка раскладывается на именованные шаги, каждый можно выполнить и проверить отдельно
  - Не нужно писать псевдонимы
  - Отключается RLS
  answer: 1
  explain: Шаг — таблица — следующий шаг. В консоли запросов содержимое каждой временной таблицы можно посмотреть.
  kb: queries/zapros-vremennye-tablicy
