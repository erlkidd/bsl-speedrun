topic: 'Запросы: группировки и итоги'
questions:
- q: Какое поле допустимо в списке ВЫБРАТЬ запроса с `СГРУППИРОВАТЬ ПО Контрагент`?
  options:
  - Любое поле таблицы
  - Только `Контрагент` и поля под агрегатными функциями
  - Только агрегатные функции
  - Только числовые поля
  answer: 1
  explain: Каждое поле либо входит в группировку, либо обёрнуто в СУММА / КОЛИЧЕСТВО / МАКСИМУМ / МИНИМУМ / СРЕДНЕЕ.
  kb: queries/zapros-gruppirovki
- q: Чем `ГДЕ` отличается от `ИМЕЮЩИЕ`?
  options:
  - Ничем
  - ГДЕ отбирает исходные строки до группировки, ИМЕЮЩИЕ — готовые группы по значениям агрегатов
  - ИМЕЮЩИЕ быстрее
  - ГДЕ работает только с числами
  answer: 1
  explain: '`ГДЕ СУММА(…) > 100` — ошибка: на этапе ГДЕ агрегатов ещё нет.'
  kb: queries/zapros-gruppirovki
- q: В группе 3 строки, в поле `Скидка` значения 10, NULL, 20. Что вернут `КОЛИЧЕСТВО(*)` и `КОЛИЧЕСТВО(Скидка)`?
  options:
  - 3 и 3
  - 3 и 2
  - 2 и 2
  - 3 и 30
  answer: 1
  explain: '`КОЛИЧЕСТВО(*)` считает строки, `КОЛИЧЕСТВО(Поле)` — только не-NULL значения.'
  kb: queries/zapros-gruppirovki
- q: Что считает `КОЛИЧЕСТВО(РАЗЛИЧНЫЕ Регистратор)`?
  options:
  - Число строк
  - Число разных документов-регистраторов в группе
  - Сумму номеров документов
  - Число колонок
  answer: 1
  explain: РАЗЛИЧНЫЕ внутри агрегата убирает повторы значения перед подсчётом.
  kb: queries/zapros-gruppirovki
- q: 'Запрос без `СГРУППИРОВАТЬ ПО`: `ВЫБРАТЬ СУММА(Сумма) ИЗ Продажи`. Сколько строк в результате?'
  options:
  - Столько же, сколько в таблице
  - Одна — вся таблица считается одной группой
  - Ноль
  - 'Ошибка: нужна группировка'
  answer: 1
  explain: Агрегат без группировки сворачивает всю выборку в одну строку.
  kb: queries/zapros-gruppirovki
- q: Можно ли группировать по выражению, например `СГРУППИРОВАТЬ ПО МЕСЯЦ(Период)`?
  options:
  - Нет, только по полям
  - Да; в списке полей тогда должно стоять то же самое выражение
  - Только во временных таблицах
  - Только по датам
  answer: 1
  explain: Группировка по выражению допустима; выражение в ВЫБРАТЬ должно совпадать с выражением в СГРУППИРОВАТЬ ПО.
  kb: queries/zapros-gruppirovki
- q: Что добавляет в результат раздел `ИТОГИ СУММА(Сумма) ПО Контрагент`?
  options:
  - Новую колонку
  - Дополнительные строки-итоги по каждому контрагенту поверх детальных строк
  - Сортировку
  - Ничего, это синоним СГРУППИРОВАТЬ
  answer: 1
  explain: ИТОГИ не сворачивают строки, а добавляют итоговые. В коде такие результаты обходят `Выбрать(ОбходРезультатаЗапроса.ПоГруппировкам)`.
  kb: queries/zapros-gruppirovki
- q: Что вернёт `СУММА(Поле)`, если во всех строках группы Поле = NULL?
  options:
  - '0'
  - 'NULL'
  - Ошибку
  - Пустую строку
  answer: 1
  explain: Агрегаты пропускают NULL; если складывать нечего, результат — NULL. Отсюда привычка писать `ЕСТЬNULL(СУММА(Поле), 0)`.
  kb: queries/zapros-gruppirovki
- q: Можно ли в `УПОРЯДОЧИТЬ ПО` использовать псевдоним колонки из списка полей?
  options:
  - Нет
  - 'Да: `УПОРЯДОЧИТЬ ПО Выручка УБЫВ`'
  - Только номер колонки
  - Только в объединениях
  answer: 1
  explain: Сортировать можно по псевдониму результата. В `ГДЕ` и `ИМЕЮЩИЕ` псевдонимы недоступны.
  kb: queries/zapros-gruppirovki
- q: Зачем маскировать дубли строк через РАЗЛИЧНЫЕ — плохая идея?
  options:
  - РАЗЛИЧНЫЕ запрещено стандартами
  - 'Дубли обычно появляются из-за лишнего соединения: суммы уже искажены, а РАЗЛИЧНЫЕ лишь прячет симптом и заставляет СУБД сортировать строки'
  - РАЗЛИЧНЫЕ не работает со ссылками
  - Это не плохая идея
  answer: 1
  explain: Сначала найди, какое соединение размножило строки, и исправь его.
  kb: queries/zapros-gruppirovki
