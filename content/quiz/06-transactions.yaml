topic: Транзакции и блокировки
questions:
  - q: Когда платформа открывает транзакцию автоматически?
    options: ["Никогда", "При записи объекта или набора записей: обработчики ПередЗаписью/ПриЗаписи/ОбработкаПроведения выполняются в транзакции", "При открытии любой формы", "При выполнении любого запроса"]
    answer: 1
    explain: Запись объекта, проведение документа, запись набора записей — всё это выполняется в транзакции. Исключение или `Отказ = Истина` в обработчике откатывают её целиком.

  - q: Чем опасны длинные транзакции?
    options: ["Ничем", "Держат блокировки дольше — растут ожидания и таймауты у других пользователей, увеличивается риск взаимоблокировок", "Транзакция автоматически фиксируется через минуту", "Они выполняются на клиенте"]
    answer: 1
    explain: Всё, что заблокировано в транзакции, остаётся заблокированным до её конца. Поэтому в транзакции не делают долгих расчётов, ожидания пользователя и обращений к внешним системам.

  - q: Что такое взаимоблокировка (deadlock)?
    options: ["Ошибка синтаксиса запроса", "Две транзакции ждут друг друга: первая держит A и ждёт B, вторая держит B и ждёт A", "Блокировка всей таблицы", "Зависание клиента"]
    answer: 1
    explain: СУБД или менеджер блокировок обнаруживает цикл ожидания и откатывает одну из транзакций. Профилактика — захватывать ресурсы в одном порядке и ставить исключительную блокировку сразу, а не повышать разделяемую.

  - q: Чем управляемые блокировки 1С отличаются от блокировок СУБД?
    options: ["Ничем", "Управляемые ставятся менеджером блокировок 1С по логическим данным (пространство + поля), ещё до обращения к СУБД; блокировки СУБД — на строки/страницы таблиц", "Управляемые работают только в файловой базе", "Блокировки СУБД ставит программист вручную"]
    answer: 1
    explain: В управляемом режиме блокировки описывают программно (`БлокировкаДанных`), их проверяет сервер 1С. СУБД при этом работает с минимальным уровнем изоляции и сама меньше блокирует.

  - q: Какой режим управляемой блокировки нужен перед чтением остатков для их последующего изменения?
    options: ["Разделяемый", "Исключительный", "Любой", "Блокировка не нужна"]
    answer: 1
    explain: Исключительная блокировка не даёт другим транзакциям ни поставить свою блокировку, ни изменить данные. Разделяемая совместима с другими разделяемыми — двое прочитают один остаток.

  - q: Что такое «объектная оптимистическая блокировка» в 1С?
    options: ["Блокировка таблицы на время записи", "Проверка при записи, что объект не изменили с момента чтения (по версии данных); если изменили — ошибка «объект изменён или удалён»", "Блокировка, которую ставит пользователь в форме", "Отключённая блокировка"]
    answer: 1
    explain: Оптимистическая — ничего не блокирует при чтении, а при записи сравнивает версию. Пессимистическая (`Заблокировать()`) запрещает другим редактировать объект, пока он открыт.
