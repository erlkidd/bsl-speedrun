title: Левое соединение руками
difficulty: 2
tags:
- соответствие
- запросы
- массивы
hints:
- 'Сначала один проход по ценам: `ЦенаПоКоду.Вставить(Строка.Код, Строка.Цена)`.'
- '`Соответствие[Ключ]` для отсутствующего ключа вернёт `Неопределено` — это аналог NULL после левого соединения.'
- 'Число в строку без разделителей групп: `Формат(Цена, "ЧН=0; ЧГ=0")`.'
function: ЦеныТоваров
cases:
- args:
  - - Код: 1
      Имя: Чай
    - Код: 2
      Имя: Кофе
    - Код: 3
      Имя: Сахар
  - - Код: 2
      Цена: 900
    - Код: 1
      Цена: 350
  expected:
  - 'Чай: 350'
  - 'Кофе: 900'
  - 'Сахар: 0'
- args:
  - []
  - - Код: 1
      Цена: 5
  expected: []
- args:
  - - Код: 7
      Имя: Соль
  - []
  expected:
  - 'Соль: 0'
rules:
  required:
  - pattern: Соответствие
    message: Используй Соответствие как индекс по коду
