title: Подстановка параметров
difficulty: 2
tags:
- строки
- структура
- запросы
hints:
- 'Обход структуры: `Для Каждого КлючИЗначение Из Параметры Цикл` — у элемента есть `.Ключ` и `.Значение`.'
- '`СтрЗаменить()` заменяет все вхождения сразу.'
function: ПодставитьПараметры
cases:
- args:
  - 'Склад [Склад]: остаток [Остаток]'
  - Склад: Основной
    Остаток: '7'
  expected: 'Склад Основной: остаток 7'
- args:
  - '[А] и [А], а [Б] нет'
  - А: x
  expected: x и x, а [Б] нет
- args:
  - Без вставок
  - А: x
  expected: Без вставок
