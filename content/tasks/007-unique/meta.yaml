title: Уникальные значения
difficulty: 2
tags:
- массивы
- соответствие
hints:
- '`Соответствие[Ключ]` возвращает `Неопределено`, если ключа нет.'
- Поиск по ключу в соответствии быстрый, а `Массив.Найти()` — перебор.
function: Уникальные
cases:
- args:
  - - 1
    - 2
    - 2
    - 3
    - 1
  expected:
  - 1
  - 2
  - 3
- args:
  - - а
    - б
    - а
  expected:
  - а
  - б
- args:
  - []
  expected: []
rules:
  required:
  - pattern: Соответствие
    message: Используй Соответствие
  forbidden:
  - pattern: \.\s*Найти\s*\(
    message: Без Массив.Найти() — это перебор на каждом шаге
