title: Склеить строки без «+» в цикле
difficulty: 1
tags:
- строки
- стандарты
hints:
- '`СтрСоединить(Массив, Разделитель)` — одна строка кода.'
- Для пустого массива `СтрСоединить` вернёт пустую строку — отдельная проверка не нужна.
function: ПеречислитьЧерезЗапятую
cases:
- args:
  - - а
    - б
    - в
  expected: а, б, в
- args:
  - - один
  expected: один
- args:
  - []
  expected: ''
rules:
  required:
  - pattern: СтрСоединить
    message: Используй СтрСоединить()
  forbidden:
  - pattern: Цикл
    message: Цикл не нужен — СтрСоединить делает всё сам
