title: Свойство структуры со значением по умолчанию
difficulty: 1
tags:
- структура
hints:
- '`Структура.Свойство(Ключ, Значение)` возвращает Булево и кладёт значение во второй параметр.'
- Не путай «ключа нет» и «ключ есть, значение Неопределено» — во втором случае вернуть нужно Неопределено.
function: ЗначениеСвойства
cases:
- args:
  - Имя: Артур
  - Имя
  - —
  expected: Артур
- args:
  - Имя: Артур
  - Возраст
  - 0
  expected: 0
- args:
  - Флаг: null
  - Флаг
  - 1
  expected: null
rules:
  required:
  - pattern: \.\s*Свойство\s*\(
    message: Используй Структура.Свойство()
  forbidden:
  - pattern: Попытка
    message: Исключения не нужны — проверь ключ через Свойство()
