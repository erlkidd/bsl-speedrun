title: ПЕРВЫЕ N по сумме
difficulty: 3
tags:
- таблица значений
- запросы
hints:
- '`Свернуть(КолонкиГруппировок, КолонкиСуммирования)` — это СГРУППИРОВАТЬ ПО + СУММА.'
- '`Сортировать("Сумма Убыв")` — это УПОРЯДОЧИТЬ ПО Сумма УБЫВ.'
- ПЕРВЫЕ N — просто `Прервать` цикл, когда набралось нужное количество.
function: ТопТоваров
cases:
- args:
  - - Товар: Чай
      Сумма: 100
    - Товар: Кофе
      Сумма: 250
    - Товар: Чай
      Сумма: 200
    - Товар: Сахар
      Сумма: 50
  - 2
  expected:
  - Чай
  - Кофе
- args:
  - - Товар: Чай
      Сумма: 100
  - 5
  expected:
  - Чай
- args:
  - []
  - 3
  expected: []
rules:
  required:
  - pattern: \.\s*Свернуть\s*\(
    message: Используй ТаблицаЗначений.Свернуть()
