title: Фамилия и инициалы
difficulty: 2
tags:
- строки
hints:
- '`СтрРазделить(Строка, " ", Ложь)` — без пустых частей от двойных пробелов.'
- '`Лев(Слово, 1)` — первая буква. Собери части в массив и соедини через `СтрСоединить`.'
function: ФамилияИнициалы
cases:
- args:
  - Иванов Иван Петрович
  expected: Иванов И. П.
- args:
  - '  Петров   Пётр '
  expected: Петров П.
- args:
  - Сидоров
  expected: Сидоров
