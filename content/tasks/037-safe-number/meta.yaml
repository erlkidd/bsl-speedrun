title: Число из строки без падения
difficulty: 2
tags:
- исключения
- строки
hints:
- '`Попытка … Исключение … КонецПопытки` перехватывает ошибку преобразования.'
- '`ПустаяСтрока()` — истина и для строки из одних пробелов.'
function: ЧислоИзСтроки
cases:
- args:
  - '42'
  expected: 42
- args:
  - '3.5'
  expected: 3.5
- args:
  - abc
  expected: 0
- args:
  - ''
  expected: 0
- args:
  - '  '
  expected: 0
- args:
  - '-7'
  expected: -7
rules:
  required:
  - pattern: Попытка
    message: Перехвати ошибку преобразования через Попытка
