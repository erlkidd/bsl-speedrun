title: Частота слов
difficulty: 2
tags:
- строки
- соответствие
hints:
- '`СтрРазделить(Строка, " ", Ложь)` — третий параметр `Ложь` выкидывает пустые части.'
- '`?(Условие, А, Б)` — тернарный оператор.'
function: ЧастотаСлов
cases:
- args:
  - мама мыла раму мама
  expected:
    $map:
    - - мама
      - 2
    - - мыла
      - 1
    - - раму
      - 1
- args:
  - '  Да  да ДА '
  expected:
    $map:
    - - да
      - 3
- args:
  - ''
  expected:
    $map: []
