title: Порции для массовой обработки
difficulty: 2
tags:
- массивы
- массовые операции
hints:
- Держи текущую порцию в отдельном массиве и «закрывай» её, когда набралось `РазмерПорции`.
- Не забудь добавить неполную последнюю порцию.
function: РазбитьНаПорции
