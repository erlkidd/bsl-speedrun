title: Разобрать JSON заказа
difficulty: 2
tags:
- JSON
- интеграции
hints:
- '`ПрочитатьJSON(Чтение)` по умолчанию возвращает Структуру — поля доступны через точку.'
- Не забудь `Чтение.Закрыть()`.
function: СуммаЗаказа
cases:
- args:
  - '{"Номер": "A-1", "Товары": [{"Цена": 100, "Количество": 2}, {"Цена": 50, "Количество": 1}]}'
  expected: 250
- args:
  - '{"Номер": "A-2", "Товары": []}'
  expected: 0
rules:
  required:
  - pattern: ПрочитатьJSON
    message: Используй ПрочитатьJSON
