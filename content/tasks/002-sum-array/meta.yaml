title: Сумма элементов массива
difficulty: 1
tags:
- массивы
- циклы
hints:
- Заведи переменную-накопитель `Сумма = 0;` до цикла.
- '`Для Каждого Элемент Из Массив Цикл ... КонецЦикла;`'
- Не забудь `Возврат Сумма;` в конце функции.
function: СуммаМассива
cases:
- args:
  - - 1
    - 2
    - 3
  expected: 6
- args:
  - []
  expected: 0
- args:
  - - -5
    - 5
    - 10.5
  expected: 10.5
- args:
  - - 100
  expected: 100
rules:
  required:
  - pattern: Для\s+Каждого
    message: Используй цикл «Для Каждого»
