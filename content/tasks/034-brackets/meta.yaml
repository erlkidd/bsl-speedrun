title: Скобки в запросе
difficulty: 2
tags:
- строки
- массивы
- запросы
hints:
- 'Хватит одного счётчика глубины: `(` — плюс один, `)` — минус один.'
- Если счётчик ушёл в минус — закрывающая скобка раньше открывающей.
function: СкобкиСбалансированы
cases:
- args:
  - ВЫБРАТЬ СУММА(Сумма) ИЗ Т ГДЕ А В (1, 2)
  expected: true
- args:
  - ЕСТЬNULL(СУММА(А), 0
  expected: false
- args:
  - )(
  expected: false
- args:
  - ''
  expected: true
- args:
  - ((()))
  expected: true
