title: Текст сообщения через СтрШаблон
difficulty: 1
tags:
- строки
- стандарты
hints:
- '`СтрШаблон("... %1 ... %2", Значение1, Значение2)`.'
- '`ЧДЦ=2` — два знака после запятой, `ЧРД=.` — точка как разделитель, `ЧГ=0` — без групп разрядов.'
function: ТекстДокумента
cases:
- args:
  - 15
  - 1234.5
  expected: Документ №15 на сумму 1234.50
- args:
  - 1
  - 1000000
  expected: Документ №1 на сумму 1000000.00
- args:
  - 7
  - 99.999
  expected: Документ №7 на сумму 100.00
rules:
  required:
  - pattern: СтрШаблон
    message: Используй СтрШаблон()
