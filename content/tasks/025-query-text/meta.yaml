title: Собрать текст запроса
difficulty: 1
tags:
- строки
- запросы
hints:
- '`СтрСоединить(Поля, ", ")` склеит имена полей.'
- '`СтрШаблон("ВЫБРАТЬ %1 ИЗ %2", …)` подставит части по номерам.'
function: ТекстЗапроса
cases:
- args:
  - Справочник.Склады
  - - Код
    - Наименование
  expected: ВЫБРАТЬ Код, Наименование ИЗ Справочник.Склады
- args:
  - Документ.Реализация
  - - Ссылка
  expected: ВЫБРАТЬ Ссылка ИЗ Документ.Реализация
- args:
  - Справочник.Валюты
  - []
  expected: ВЫБРАТЬ * ИЗ Справочник.Валюты
